 schoss den Ball ins Tor.",["Der Ball schoss den St\xFCrmer ins Tor.","Der St\xFCrmer wurde ins Tor geschossen.","Dem St\xFCrmer wurde der Ball geschossen."],"Aus \xABvom St\xFCrmer\xBB wird im Aktiv das Subjekt.","Aktiv und Passiv"),()=>T("Was bedeutet die Redewendung \xABden Ball flach halten\xBB?","sich zur\xFCckhalten und nicht \xFCbertreiben",["laut jubeln","schnell rennen","die Regeln \xE4ndern"],"Wer den Ball flach h\xE4lt, bleibt ruhig und macht keine grosse Sache daraus.","Redewendungen")]],Ah={mathe:"Mathematik",deutsch:"Deutsch"},Si=[{f:"Wie viele Ninja braucht es, um eine Gl\xFChbirne zu wechseln?",a:"Keine Ahnung. Man hat noch keinen gesehen."},{f:"Warum nehmen Ninja nie den Lift?",a:"Auf der Treppe h\xF6rt man sie auch nicht."},{f:"Wie nennt man einen Ninja, der nicht schleichen kann?",a:"Erwischt."},{f:"Warum tragen Ninja immer Schwarz?",a:"Damit niemand fragt, wer die Vase umgeworfen hat."},{f:"Warum geht ein Baustein nie barfuss?",a:"Er hat Angst, auf sich selbst zu treten."},{f:"Warum streiten Bausteine nie lange?",a:"Am Schluss halten sie sowieso zusammen."},{f:"Was ist die Lieblingszahl eines Zweier-Vierer-Steins?",a:"Acht. So viele Noppen hat er."},{f:"Mutter: \xABWarum ist dein Zimmer so unordentlich?\xBB",a:"\xABDas ist keine Unordnung, das ist ein Bauplatz.\xBB"},{f:"Ein Fahrgast fragt: \xABF\xE4hrt dieses Tram zur Rehalp?\xBB",a:"\xABNein. Es f\xE4hrt nach Fahrplan.\xBB"},{f:"Warum ist das 4er nie aus der Puste?",a:"Weil es immer im Takt bleibt."},{f:"Was ist das Lieblingsfach eines Trams?",a:"Geometrie. Es mag Geraden."},{f:"Warum nimmt der Tramf\xFChrer ein Buch mit?",a:"In der Wendeschlaufe hat er kurz Zeit."},{f:"Warum nimmt ein Fussballer einen Faden mit ins Stadion?",a:"Damit er den Ball einnetzen kann."},{f:"Der Trainer sagt: \xABDu spielst wie ein Handy.\xBB Der Spieler fragt: \xABWieso?\xBB",a:"\xABKein Empfang.\xBB"},{f:"Warum darf ein Fussballer nicht ins Museum?",a:"Weil er dort nichts schiessen darf."},{f:"Warum z\xE4hlt der Schiedsrichter so gern?",a:"Beim Elfmeter kommt er bis elf."},{f:"Was sagt der Ball zum Tor?",a:"Nichts. Er ist schon rein."},{f:"Was ist der Unterschied zwischen einem Fussball und einem Mathebuch?",a:"Den Fussball gibst du weiter."},{f:"Die Lehrerin fragt: \xABDu hast drei Franken, deine Mutter gibt dir zwei dazu. Wie viel hast du?\xBB \u2013 \xABDrei.\xBB \u2013 \xABDu kannst nicht rechnen!\xBB",a:"\xABSie kennen meine Mutter nicht.\xBB"},{f:"Warum k\xF6nnen Geister so schlecht l\xFCgen?",a:"Weil man durch sie durchschaut."},{f:"Warum haben Giraffen so lange H\xE4lse?",a:"Weil ihre F\xFCsse so weit weg sind."},{f:"Was ist gr\xFCn und klopft an die T\xFCr?",a:"Ein Klopfsalat."},{f:"Was ist orange und wandert \xFCber die Berge?",a:"Eine Wanderine."},{f:"Was sagt ein grosser Stift zum kleinen Stift?",a:"Wachs mal, Stift."},{f:"Was macht ein Pirat auf dem Spielplatz?",a:"Er entert die Rutschbahn."},{f:"Warum sind Fische so schlau?",a:"Sie denken immer im Schwarm."},{f:"Was ist rot und sitzt auf einem Baum?",a:"Eine w\xFCtende Kirsche."},{f:"Warum kommt die S18 in Esslingen immer p\xFCnktlich an?",a:"Dort h\xF6rt die Strecke auf."}],Wg=[[{titel:"Der L\xF6we und die Maus",quelle:"nach Aesop",text:"Ein L\xF6we schlief im Schatten eines Baumes. Eine kleine Maus lief \xFCber seine Pfote und weckte ihn. Der L\xF6we packte sie mit der Tatze. \xABLass mich leben\xBB, bat die Maus, \xABvielleicht kann ich dir eines Tages helfen.\xBB Der L\xF6we lachte und liess sie frei. Wochen sp\xE4ter fing ein J\xE4ger den L\xF6wen in einem Netz. Die Maus h\xF6rte sein Br\xFCllen, kam herbei und nagte das Netz durch.",qs:[{q:"Wo schlief der L\xF6we?",options:["im Schatten eines Baumes","in einer H\xF6hle","im hohen Gras","am Fluss"],correct:0,why:"Im ersten Satz steht: im Schatten eines Baumes.",art:"Detail"},{q:"Warum lachte der L\xF6we?",options:["Er glaubte nicht, dass ihm eine so kleine Maus helfen k\xF6nnte.","Die Maus hatte ihn gekitzelt.","Er freute sich \xFCber das Aufwachen.","Er hatte gerade gegessen."],correct:0,why:"Das Lachen zeigt, dass er das Angebot nicht ernst nahm.",art:"Schlussfolgern"},{q:"Was will die Geschichte sagen?",options:["Auch die Kleinen k\xF6nnen den Grossen helfen.","M\xE4use sind gef\xE4hrlich.","Man soll im Schatten schlafen.","J\xE4ger fangen immer L\xF6wen."],correct:0,why:"Die kleine Maus rettet am Schluss den grossen L\xF6wen.",art:"Kernaussage"},{q:"Was passiert im Text zuletzt?",options:["Die Maus nagt das Netz durch.","Der L\xF6we packt die Maus.","Die Maus weckt den L\xF6wen.","Der J\xE4ger stellt sein Netz auf."],correct:0,why:"Zuerst die Begegnung, dann das Netz, zuletzt die Rettung.",art:"Reihenfolge"}]},{titel:"Heidi steigt zur Alp",quelle:"nach Johanna Spyri",text:"Heidi stieg mit der Tante den steilen Weg zur Alp hinauf. Die Sonne brannte, und Heidi hatte alle ihre Kleider \xFCbereinander angezogen, weil sie sonst niemand h\xE4tte tragen k\xF6nnen. Bald war ihr so heiss, dass sie stehen blieb und alles auszog, bis nur das leichte Unterkleid \xFCbrig war. Die Tante schalt sie, doch Heidi lief schon barfuss weiter und kam viel schneller vorw\xE4rts als vorher.",qs:[{q:"Warum trug Heidi mehrere Kleider \xFCbereinander?",options:["Weil sie sie sonst niemand getragen h\xE4tte.","Weil es kalt war.","Weil die Tante es befahl.","Weil sie sie zeigen wollte."],correct:0,why:"Im Text steht der Grund direkt: sonst h\xE4tte sie niemand tragen k\xF6nnen.",art:"Detail"},{q:"Was bedeutet \xABschalt\xBB in diesem Text?",options:["schimpfte","lobte","lachte","schwieg"],correct:0,why:"\xABschelten\xBB heisst schimpfen.",art:"Wortschatz"},{q:"Wie ging es Heidi nach dem Ausziehen?",options:["Sie kam schneller vorw\xE4rts.","Sie wurde langsamer.","Sie fror.","Sie musste getragen werden."],correct:0,why:"Der letzte Satz sagt: viel schneller als vorher.",art:"Schlussfolgern"},{q:"Was tat Heidi, bevor sie barfuss weiterlief?",options:["Sie zog die Kleider aus.","Sie trank Wasser.","Sie rief nach dem Grossvater.","Sie setzte sich in den Schatten."],correct:0,why:"Erst kamen die Kleider weg, dann lief sie weiter.",art:"Reihenfolge"}]},{titel:"Der Hase und der Igel",quelle:"nach den Br\xFCdern Grimm",text:"Der Hase spottete \xFCber die kurzen Beine des Igels. \xABWollen wir um die Wette laufen?\xBB, fragte der Igel. Der Hase lachte und war einverstanden. Der Igel stellte aber seine Frau ans andere Ende des Ackers. Als der Hase dort ankam, rief sie: \xABIch bin schon da!\xBB Der Hase wollte es nicht glauben und lief noch einmal. So ging es weiter, bis er ersch\xF6pft liegen blieb.",qs:[{q:"Wer wartete am anderen Ende des Ackers?",options:["die Frau des Igels","der Igel selbst","ein zweiter Hase","niemand"],correct:0,why:"Der Igel stellte seine Frau dorthin.",art:"Detail"},{q:"Warum konnte der Igel gewinnen?",options:["Er benutzte einen Trick mit zwei Igeln.","Er lief schneller als der Hase.","Der Hase verlief sich.","Der Acker war zu kurz."],correct:0,why:"Zwei gleich aussehende Igel standen an beiden Enden.",art:"Schlussfolgern"},{q:"Was passiert zuerst?",options:["Der Hase spottet \xFCber den Igel.","Der Hase bleibt liegen.","Die Igelfrau ruft.","Der Igel schl\xE4gt die Wette vor."],correct:0,why:"Der Spott steht am Anfang, danach kommt die Wette.",art:"Reihenfolge"}]}],[{titel:"Die Ameise und die Grille",quelle:"nach Aesop",text:"Den ganzen Sommer sang die Grille im Gras. Die Ameise dagegen trug Tag f\xFCr Tag Korn in ihren Bau. \xABKomm doch singen\xBB, rief die Grille. \xABDer Winter kommt\xBB, antwortete die Ameise und arbeitete weiter. Als der Schnee fiel, hatte die Grille nichts zu essen. Sie klopfte bei der Ameise an und bat um Korn. \xABWas hast du den Sommer \xFCber getan?\xBB, fragte die Ameise. \xABIch habe gesungen.\xBB \u2013 \xABDann tanze jetzt\xBB, sagte die Ameise und schloss die T\xFCr.",qs:[{q:"Was tat die Ameise den ganzen Sommer?",options:["Sie trug Korn in ihren Bau.","Sie sang im Gras.","Sie schlief.","Sie besuchte die Grille."],correct:0,why:"Tag f\xFCr Tag trug sie Korn ein.",art:"Detail"},{q:"Was ist ein \xABBau\xBB hier?",options:["die Wohnung eines Tieres im Boden","ein Haus aus Steinen","ein Kornfeld","ein Weg"],correct:0,why:"Ameisen wohnen in einem Bau unter der Erde.",art:"Wortschatz"},{q:"Warum schloss die Ameise die T\xFCr?",options:["Weil die Grille im Sommer nicht vorgesorgt hatte.","Weil sie kein Korn mehr hatte.","Weil es zu kalt wurde.","Weil die Grille zu laut sang."],correct:0,why:"Die Ameise findet, wer nur singt, soll nicht vom Vorrat der anderen leben.",art:"Schlussfolgern"},{q:"Welche Reihenfolge stimmt?",options:["Die Grille singt \u2013 der Schnee f\xE4llt \u2013 die Grille klopft an.","Die Grille klopft an \u2013 der Schnee f\xE4llt \u2013 die Grille singt.","Der Schnee f\xE4llt \u2013 die Grille singt \u2013 die Ameise sammelt.","Die Ameise klopft an \u2013 die Grille sammelt \u2013 der Winter kommt."],correct:0,why:"Zuerst der Sommer, dann der Winter, dann die Bitte um Korn.",art:"Reihenfolge"}]},{titel:"Die Bremer Stadtmusikanten",quelle:"nach den Br\xFCdern Grimm",text:"Die vier Tiere kamen an ein Haus, in dem R\xE4uber sassen. Der Esel stellte sich vor das Fenster, der Hund sprang ihm auf den R\xFCcken, die Katze dem Hund auf den R\xFCcken und der Hahn ganz nach oben. Dann fingen alle zugleich an: Der Esel schrie, der Hund bellte, die Katze miaute und der Hahn kr\xE4hte. Die R\xE4uber sprangen auf und flohen in den Wald, weil sie ein Gespenst vermuteten.",qs:[{q:"Welches Tier war ganz oben?",options:["der Hahn","die Katze","der Hund","der Esel"],correct:0,why:"Der Hahn setzte sich ganz nach oben.",art:"Detail"},{q:"Warum flohen die R\xE4uber?",options:["Sie hielten den L\xE4rm f\xFCr ein Gespenst.","Sie erkannten die vier Tiere.","Das Haus brannte.","Die Polizei kam."],correct:0,why:"Sie konnten den L\xE4rm nicht erkl\xE4ren und vermuteten ein Gespenst.",art:"Schlussfolgern"},{q:"Wie viele Tiere waren es?",options:["vier","drei","f\xFCnf","zwei"],correct:0,why:"Es sind Esel, Hund, Katze und Hahn.",art:"Detail"},{q:"In welcher Reihenfolge stiegen die Tiere aufeinander?",options:["Esel \u2013 Hund \u2013 Katze \u2013 Hahn","Hahn \u2013 Katze \u2013 Hund \u2013 Esel","Esel \u2013 Katze \u2013 Hund \u2013 Hahn","Hund \u2013 Esel \u2013 Hahn \u2013 Katze"],correct:0,why:"Der Esel stand unten, darauf der Hund, dann die Katze, zuoberst der Hahn.",art:"Reihenfolge"}]},{titel:"Kannitverstan",quelle:"nach Johann Peter Hebel",text:"Ein junger Handwerker kam nach Amsterdam. Er sah ein pr\xE4chtiges Haus und fragte einen Mann, wem es geh\xF6re. Der Mann verstand die Frage nicht und antwortete: \xABKannitverstan.\xBB Sp\xE4ter sah der Handwerker ein grosses Schiff und fragte wieder. Wieder hiess es: \xABKannitverstan.\xBB Am Abend begegnete er einem Trauerzug und fragte, wen man begrabe. \xABKannitverstan\xBB, sagte man ihm. Da dachte er: Auch der reiche Kannitverstan hat alles zur\xFCcklassen m\xFCssen.",qs:[{q:"Was bedeutet \xABKannitverstan\xBB wirklich?",options:["Ich kann dich nicht verstehen.","Der Name eines reichen Kaufmanns.","Das geh\xF6rt der Stadt.","Komm morgen wieder."],correct:0,why:"Die Leute sagten auf Niederl\xE4ndisch, dass sie ihn nicht verstehen.",art:"Wortschatz"},{q:"Warum glaubte der Handwerker, alles geh\xF6re einem Mann?",options:["Er hielt die Antwort f\xFCr einen Namen.","Man hatte es ihm so erkl\xE4rt.","Er las es auf einem Schild.","Alle H\xE4user sahen gleich aus."],correct:0,why:"Er verstand \xABKannitverstan\xBB als Personennamen.",art:"Schlussfolgern"},{q:"Was ist die Kernaussage?",options:["Reichtum kann man nicht mitnehmen.","Man soll Niederl\xE4ndisch lernen.","Amsterdam ist eine reiche Stadt.","Handwerker reisen viel."],correct:0,why:"Am Schluss sieht er, dass auch der Reiche alles zur\xFCcklassen muss.",art:"Kernaussage"},{q:"Was sah der Handwerker in welcher Reihenfolge?",options:["das Haus \u2013 das Schiff \u2013 der Trauerzug","das Schiff \u2013 das Haus \u2013 der Trauerzug","der Trauerzug \u2013 das Haus \u2013 das Schiff","das Haus \u2013 der Trauerzug \u2013 das Schiff"],correct:0,why:"Zuerst das Haus, sp\xE4ter das Schiff, am Abend den Trauerzug.",art:"Reihenfolge"}]}],[{titel:"Heidi in Frankfurt",quelle:"nach Johanna Spyri",text:"In Frankfurt hatte Heidi ein weiches Bett und jeden Tag genug zu essen. Trotzdem wurde sie stiller und blasser. Nachts tr\xE4umte sie von den Tannen und vom Wind auf der Alp. Fr\xE4ulein Rottenmeier sah nur, dass das Kind schlecht gehorchte, und wurde strenger. Der Doktor aber kam, setzte sich zu Heidi und liess sie erz\xE4hlen. Danach sagte er zu Herrn Sesemann: \xABDas Kind muss nach Hause, sonst wird es krank.\xBB",qs:[{q:"Warum wurde Heidi immer blasser?",options:["Sie hatte Heimweh.","Sie bekam zu wenig zu essen.","Ihr Bett war zu hart.","Sie war erk\xE4ltet."],correct:0,why:"Sie hatte alles, tr\xE4umte aber von der Alp \u2013 das ist Heimweh.",art:"Schlussfolgern"},{q:"Wer erkannte, was Heidi fehlte?",options:["der Doktor","Fr\xE4ulein Rottenmeier","Herr Sesemann","die Tante"],correct:0,why:"Der Doktor setzte sich zu ihr und liess sie erz\xE4hlen.",art:"Detail"},{q:"Was unterscheidet den Doktor von Fr\xE4ulein Rottenmeier?",options:["Er h\xF6rte Heidi zu, statt sie nur zu erziehen.","Er war strenger als sie.","Er wohnte auf der Alp.","Er verstand kein Deutsch."],correct:0,why:"Sie sah nur den Ungehorsam, er fragte nach dem Grund.",art:"Schlussfolgern"},{q:"Welche Reihenfolge stimmt?",options:["Heidi wird blasser \u2013 Fr\xE4ulein Rottenmeier wird strenger \u2013 der Doktor kommt.","Der Doktor kommt \u2013 Heidi wird blasser \u2013 Fr\xE4ulein Rottenmeier wird strenger.","Fr\xE4ulein Rottenmeier wird strenger \u2013 der Doktor kommt \u2013 Heidi wird blasser.","Heidi reist heim \u2013 der Doktor kommt \u2013 Heidi wird blasser."],correct:0,why:"Erst ver\xE4ndert sich das Kind, dann wird die Erzieherin strenger, dann kommt der Doktor.",art:"Reihenfolge"}]},{titel:"Der Fischer und seine Frau",quelle:"nach den Br\xFCdern Grimm",text:"Ein armer Fischer fing einen Butt, der sprechen konnte. Der Butt bat um sein Leben, und der Fischer liess ihn frei. Als seine Frau davon h\xF6rte, schickte sie ihn zur\xFCck: Sie wollte eine H\xFCtte statt der alten Kate. Der Butt erf\xFCllte den Wunsch. Doch bald wollte die Frau ein Haus, dann ein Schloss, dann K\xF6nigin sein. Jedes Mal ging der Fischer zum Meer, und jedes Mal wurde das Wasser dunkler und wilder. Als sie schliesslich sein wollte wie Gott, sass sie wieder in der alten Kate.",qs:[{q:"Was w\xFCnschte die Frau als Erstes?",options:["eine H\xFCtte","ein Schloss","K\xF6nigin zu sein","einen neuen Butt"],correct:0,why:"Zuerst wollte sie nur eine H\xFCtte statt der Kate.",art:"Reihenfolge"},{q:"Was ist eine \xABKate\xBB?",options:["eine armselige kleine H\xFCtte","ein Fischerboot","ein grosses Haus","ein Netz"],correct:0,why:"Der Text stellt die Kate der besseren H\xFCtte gegen\xFCber.",art:"Wortschatz"},{q:"Was bedeutet es, dass das Meer immer dunkler wurde?",options:["Es zeigt, dass die W\xFCnsche zu weit gingen.","Es wurde einfach Abend.","Der Butt war krank.","Ein Sturm war vorhergesagt."],correct:0,why:"Das Meer spiegelt, wie masslos die W\xFCnsche werden.",art:"Schlussfolgern"}]},{titel:"Ein Bienenvolk",quelle:"Sachtext",text:"Ein Bienenvolk besteht aus einer K\xF6nigin, einigen tausend Drohnen und vielen Arbeiterinnen. Die K\xF6nigin legt die Eier, die Drohnen sind f\xFCr die Paarung da, und die Arbeiterinnen tun fast alles andere: Sie putzen den Stock, f\xFCttern die Brut, bauen Waben und sammeln Nektar. Eine Arbeiterin lebt im Sommer nur wenige Wochen, weil die viele Arbeit sie aufbraucht. Findet eine Biene eine gute Futterstelle, so tanzt sie im Stock und zeigt den anderen mit ihren Bewegungen, in welche Richtung sie fliegen m\xFCssen.",qs:[{q:"Wer legt die Eier?",options:["die K\xF6nigin","die Arbeiterinnen","die Drohnen","alle gemeinsam"],correct:0,why:"Das ist die Aufgabe der K\xF6nigin.",art:"Detail"},{q:"Warum lebt eine Arbeiterin im Sommer nur wenige Wochen?",options:["Weil die viele Arbeit sie aufbraucht.","Weil es im Sommer zu heiss ist.","Weil die K\xF6nigin sie verjagt.","Weil sie zu wenig Nektar findet."],correct:0,why:"Der Text nennt die Arbeit als Grund.",art:"Detail"},{q:"Wie zeigt eine Biene den Weg zum Futter?",options:["mit einem Tanz im Stock","mit lautem Summen","sie f\xFChrt die anderen hin","mit Duft auf den Waben"],correct:0,why:"Sie tanzt und zeigt so die Richtung.",art:"Detail"},{q:"Welche Reihenfolge beschreibt der Text?",options:["Futterstelle finden \u2013 im Stock tanzen \u2013 die Richtung zeigen","im Stock tanzen \u2013 Futterstelle finden \u2013 die Richtung zeigen","die Richtung zeigen \u2013 Futterstelle finden \u2013 im Stock tanzen","Waben bauen \u2013 Eier legen \u2013 Nektar sammeln"],correct:0,why:"Erst findet die Biene das Futter, dann tanzt sie und zeigt damit die Richtung.",art:"Reihenfolge"}]}],[{titel:"Kleider machen Leute",quelle:"nach Gottfried Keller",text:"Der Schneidergeselle Wenzel Strapinski wanderte an einem kalten Tag die Landstrasse hinunter. Er hatte keine Arbeit und kein Geld, trug aber einen pr\xE4chtigen Mantel mit Pelzkragen, das letzte St\xFCck aus besseren Zeiten. Ein Kutscher nahm ihn mit. In Goldach hielt der Wagen vor dem Gasthof, und weil Wenzel so vornehm aussah, hielt man ihn f\xFCr einen Grafen. Er wollte widersprechen, doch man liess ihn nicht zu Wort kommen, und bald traute er sich nicht mehr.",qs:[{q:"Warum hielt man Wenzel f\xFCr einen Grafen?",options:["Wegen seines vornehmen Mantels.","Weil er im Gasthof wohnte.","Weil er es selbst behauptete.","Weil der Kutscher es erz\xE4hlte."],correct:0,why:"Nur der Mantel sah vornehm aus \u2013 Geld hatte er keines.",art:"Schlussfolgern"},{q:"Warum widersprach Wenzel nicht?",options:["Er kam nicht zu Wort und traute sich dann nicht mehr.","Er wollte reich erscheinen.","Er sprach die Sprache nicht.","Man hatte ihm Geld versprochen."],correct:0,why:"Der Text sagt: man liess ihn nicht zu Wort kommen.",art:"Detail"},{q:"Welcher Titel passt zum Text?",options:["Kleider machen Leute","Der reiche Graf von Goldach","Die lange Wanderung","Das kalte Wetter"],correct:0,why:"Die Kleider allein machen aus dem armen Gesellen einen Grafen.",art:"Kernaussage"},{q:"Welche Reihenfolge stimmt?",options:["Wenzel wandert \u2013 ein Kutscher nimmt ihn mit \u2013 man h\xE4lt ihn f\xFCr einen Grafen.","Man h\xE4lt ihn f\xFCr einen Grafen \u2013 Wenzel wandert \u2013 ein Kutscher nimmt ihn mit.","Ein Kutscher nimmt ihn mit \u2013 Wenzel wandert \u2013 er widerspricht.","Wenzel widerspricht \u2013 man h\xE4lt ihn f\xFCr einen Grafen \u2013 er wandert."],correct:0,why:"Erst der Weg zu Fuss, dann die Kutsche, dann die Verwechslung in Goldach.",art:"Reihenfolge"}]},{titel:"Der Grossvater und das Kind",quelle:"nach Johanna Spyri",text:"Am Anfang wollte der Alm\xF6hi das Kind nicht. Er hatte sich von den Menschen im Dorf abgewandt und lebte allein mit seinen Ziegen. Als Heidi kam, sagte er kein freundliches Wort. Doch das Kind f\xFCrchtete sich nicht. Es holte sich selbst einen Schemel, machte sein Bett aus Heu und fragte nach allem, was es sah. Nach wenigen Tagen zimmerte der Grossvater einen h\xF6heren Stuhl, damit Heidi am Tisch \xFCber den Rand sehen konnte. Gesagt hatte er nichts.",qs:[{q:"Woran merkt man, dass der Grossvater Heidi mochte?",options:["Er zimmerte ihr einen h\xF6heren Stuhl.","Er lobte sie jeden Tag.","Er ging mit ihr ins Dorf.","Er schenkte ihr eine Ziege."],correct:0,why:"Er zeigt es mit einer Tat, nicht mit Worten.",art:"Schlussfolgern"},{q:"Was ist ein \xABSchemel\xBB?",options:["ein kleiner Stuhl ohne Lehne","ein Tisch","eine Truhe","ein Bett"],correct:0,why:"Heidi holte sich etwas zum Sitzen.",art:"Wortschatz"},{q:"Was bedeutet der letzte Satz \xABGesagt hatte er nichts\xBB?",options:["Er zeigte seine Zuneigung durch Taten statt durch Worte.","Er war stumm.","Er hatte Heidi nicht bemerkt.","Er war noch immer w\xFCtend."],correct:0,why:"Der Satz betont den Gegensatz zwischen Tat und Schweigen.",art:"Schlussfolgern"},{q:"Was geschieht im Text zuletzt?",options:["Der Grossvater zimmert einen h\xF6heren Stuhl.","Heidi holt sich einen Schemel.","Der Grossvater sagt kein freundliches Wort.","Heidi macht ihr Bett aus Heu."],correct:0,why:"\xABNach wenigen Tagen\xBB steht am Schluss \u2013 da baut er den Stuhl.",art:"Reihenfolge"}]}],[{titel:"Die Verwechslung w\xE4chst",quelle:"nach Gottfried Keller",text:"In Goldach wuchs die Verwechslung von Tag zu Tag. Jeder wollte den vermeintlichen Grafen zuerst bewirten, und wer ihn am l\xE4ngsten bei sich behielt, galt als der Feinste. Wenzel sass in seidenen Kleidern an gedeckten Tischen und wurde dabei immer ungl\xFCcklicher, denn er wusste ja, was er war. Nur Nettchen, die Tochter des Amtsrats, sah ihn wirklich an. Als die Wahrheit schliesslich herauskam, verachteten ihn alle \u2013 ausser ihr.",qs:[{q:"Was bedeutet \xABvermeintlich\xBB?",options:["nur angeblich, nicht wirklich","sehr reich","heimlich","endg\xFCltig"],correct:0,why:"Er war eben kein echter Graf.",art:"Wortschatz"},{q:"Warum wurde Wenzel ungl\xFCcklicher, obwohl es ihm gut ging?",options:["Weil er die Wahrheit kannte und Angst hatte.","Weil das Essen schlecht war.","Weil er heimwollte.","Weil er kein Geld bekam."],correct:0,why:"Er wusste, dass er nicht der war, f\xFCr den man ihn hielt.",art:"Schlussfolgern"},{q:"Was unterscheidet Nettchen von den anderen?",options:["Sie sah den Menschen und nicht die Kleider.","Sie war die Reichste im Dorf.","Sie kannte die Wahrheit von Anfang an.","Sie sprach nie mit ihm."],correct:0,why:"Sie sah ihn wirklich an und hielt auch danach zu ihm.",art:"Kernaussage"},{q:"Welche Reihenfolge stimmt?",options:["Alle wollen ihn bewirten \u2013 die Wahrheit kommt heraus \u2013 alle verachten ihn.","Die Wahrheit kommt heraus \u2013 alle wollen ihn bewirten \u2013 Nettchen sieht ihn an.","Alle verachten ihn \u2013 die Wahrheit kommt heraus \u2013 alle wollen ihn bewirten.","Nettchen verl\xE4sst ihn \u2013 die Wahrheit kommt
