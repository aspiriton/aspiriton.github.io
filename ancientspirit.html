 rather than the figure alone."),z("recht",2,"Which grape is mandated for PDO Naoussa?","Xinomavro, at 100 %",["Xinomavro with up to 20 % Negoska","Agiorgitiko","Limnio"],"Any addition of another variety forces the wine out of the appellation. Naoussa covers dry red wine only."),z("recht",2,"What does PDO Nemea require?","100 % Agiorgitiko",["a minimum of 85 % Agiorgitiko","Agiorgitiko blended with Cabernet Sauvignon","any red variety grown in the zone"],"Nemea is the largest red PDO zone in Greece. Vineyards run from roughly 200 to 850 metres, which is why the appellation spans such different styles."),z("recht",2,"What is the minimum Assyrtiko requirement for dry PDO Santorini?","85 %, with the balance from Athiri or Aidani",["100 %","51 %","70 %, balance any white variety"],"The same two partner varieties appear in the appellation's other styles. Assyrtiko accounts for roughly 70 % of all plantings on the island."),z("recht",3,"What does the Vinsanto specification of PDO Santorini require?","a minimum of 51 % Assyrtiko from sun-dried grapes, aged at least 24 months in oak",["100 % Assyrtiko, aged 12 months in oak","a minimum of 85 % Assyrtiko, no oak requirement","any white variety, aged 36 months"],"Sun-drying concentrates sugar before fermentation. The 24-month oak minimum is a floor, not a norm \u2014 many houses hold their Vinsanto for a decade or more."),z("recht",3,"Which Greek PDO is authorised for still and sparkling ros\xE9?","Amynteo",["Naoussa","Nemea","Rapsani"],"Amynteo was designated in 1972 for dry red and sparkling blanc de noirs; an amendment in 1995 extended it to ros\xE9. Xinomavro is the sole permitted variety."),z("recht",3,"What are the ageing minima for a PDO red labelled Reserve?","three years total",["two years total","four years total","18 months, of which 12 in oak"],"For whites Reserve is two years, including a minimum of six months in oak and six in bottle. Grand Reserve raises it to three years for whites and four for reds."),z("recht",2,"PDO Santorini carries an unusual restriction among Greek appellations. What?","oak ageing is not permitted under the general provisions that allow it elsewhere",["bottling must occur on the island","irrigation is compulsory","only estate fruit may be used"],"Santorini and Monemvasia-Malvasia are the exceptions to the general permission for barrel ageing. Note that this concerns the base appellation provisions, not the separately specified Nykteri and Vinsanto styles."),z("recht",3,"Which appellation covers Robola?","PDO Robola of Cephalonia",["PDO Zitsa","PDO Paros","PDO Anchialos"],"Cephalonia carries several PDOs: Robola of Cephalonia, Muscat of Cephalonia and Mavrodaphne of Cephalonia."),z("sorten",1,"Which red variety was Greece's most widely planted as of 2012?","Agiorgitiko",["Xinomavro","Mandilaria","Limnio"],"It is traditionally associated with Nemea but planted across the country, including Attica and Macedonia."),z("sorten",1,"Which variety is most often compared to Nebbiolo, and why?","Xinomavro, for its high acidity, firm tannin and slow development",["Agiorgitiko, for its perfume","Limnio, for its age","Mandilaria, for its colour"],"The comparison is conventional trade shorthand rather than a genetic or chemical claim. Xinomavro is not closely related to Nebbiolo."),z("sorten",2,"Which descriptors are conventionally associated with Xinomavro?","tomato, black olive, dried fruit, high acidity, austere tannin",["tropical fruit and low acidity","violet, blueberry, soft tannin","honey and beeswax"],"The tomato and olive notes are the trade's usual markers. With bottle age the profile is generally described as moving toward mushroom and tobacco leaf."),z("sorten",2,"What makes Assyrtiko unusual among white varieties in warm climates?","it retains high acidity even at high sugar ripeness and alcohol",["it never exceeds 11 % alcohol","it has no malic acid","it ripens only above 800 m"],"That combination is why it attracts research interest for climate resilience \u2014 and why Santorini whites can show both weight and cut."),z("sorten",2,"Which two varieties are blended with Xinomavro in PDO Rapsani?","Krasato and Stavroto",["Negoska and Limnio","Kotsifali and Mandilaria","Athiri and Aidani"],"Rapsani sits on the slopes of Mount Olympus. The blend gives a softer, fuller-bodied wine than the pure Xinomavro of Naoussa."),z("sorten",2,"Where is Vidiano indigenous, and which varieties is it genetically close to?","Crete; close to Thrapsathiri and Vilana",["Cephalonia; close to Robola","Lemnos; close to Muscat","Naxos; close to Assyrtiko"],"It is grown mostly around Rethymno and secondarily near Heraklion. The berries have thick skins and ripen early; the vine is sensitive to powdery mildew."),z("sorten",3,"Which ancient red variety is associated with Lemnos and referenced by Aristotle?","Limnio",["Mavrotragano","Mandilaria","Kotsifali"],"Its documented use in winemaking runs beyond two thousand years, which makes it one of the oldest continuously cultivated varieties with a written record."),z("sorten",2,"Which variety defines PDO Mantinia?","Moschofilero",["Roditis","Savatiano","Debina"],"Mantinia sits on a high plateau in the Peloponnese. Moschofilero is a pink-skinned variety, which affects handling in the cellar."),z("sorten",2,"Which variety underpins the sparkling wines of PDO Zitsa in Epirus?","Debina",["Robola","Athiri","Malagousia"],"Zitsa produces both still and traditional-method sparkling wine from this high-acid variety."),z("sorten",3,"Who is credited with reviving Malagousia as a commercial variety?","Gerovassiliou",["Gaia","Boutari","Sigalas"],"The variety had dwindled to near-disappearance before the revival. It is now widely planted and one of Greece's better-known whites internationally."),z("sorten",3,"Which three Cretan varieties appear in the island's red PDO blends such as Dafnes and Peza?","Liatiko, Kotsifali and Mandilaria",["Xinomavro, Krasato and Stavroto","Agiorgitiko, Limnio and Negoska","Vidiano, Vilana and Thrapsathiri"],"Vidiano, Vilana and Thrapsathiri are the island's whites. Liatiko is also the basis of sweet styles in Dafnes and Sitia."),z("sorten",2,"Which islands anchor Greece's Muscat-based PDOs?","Samos, Lemnos and Rhodes, with further Muscat PDOs around Patras and Cephalonia",["Santorini, Paros and Naxos","Crete, Corfu and Zakynthos","Chios, Lesbos and Ikaria"],"Muscat of Samos is the best known internationally. Patras carries both Muscat and Mavrodaphne designations."),z("sorten",3,"What is the status of the claim that Robola and Ribolla Gialla are the same variety?","It is an old claim based on name and geography, not something to state as settled",["It is confirmed by DNA and universally accepted","It has been definitively disproved and is never repeated","The two names refer to the same vine in every reference work"],"The similarity of name and the proximity of the Ionian islands to Italy have long invited the identification. It circulates widely; treat it as contested rather than as fact in either direction."),z("weinberg",1,"What is kouloura?","a basket training system in which the vine is woven low to the ground",["a pruning knife used on Crete","a soil type of the Cyclades","a pergola system on Rhodes"],"The basket shelters the fruit from wind, sun and blown sand. It is a response to Santorini's specific conditions rather than a general Greek practice."),z("weinberg",2,"Why are Santorini's vines ungrafted?","the sandy, low-clay volcanic soils are inhospitable to phylloxera",["the island was quarantined during the epidemic","grafting is prohibited by the PDO","the rootstocks do not survive the heat"],"Sandy soils frustrate the louse generally; the same effect is seen in a handful of other regions. Average vine age on the island is given as over seventy years."),z("weinberg",2,"What is the approximate vineyard area of PDO Santorini?","around 1200 hectares",["around 120 hectares","around 6000 hectares","around 15 000 hectares"],"The appellation covers Thira and Thirasia. Land pressure from tourism is a live commercial issue for the appellation."),z("weinberg",2,"What is the dominant water regime on Santorini?","dry farming, because water is scarce",["drip irrigation from desalination","flood irrigation in winter","irrigation is mandated by the PDO"],"Vines draw on nocturnal humidity and stored soil moisture. It is one reason yields are very low."),z("weinberg",2,"Where is PDO Naoussa sited?","on the southeastern slopes of Mount Vermio in Imathia, Macedonia, roughly 150 to 400 m",["on the slopes of Mount Olympus in Thessaly","on the Mantinia plateau in the Peloponnese","in the Lilantio plain on Euboea"],"Rapsani is the Olympus appellation. Confusing the two is a common exam slip, since both are Xinomavro-based."),z("weinberg",3,"Across what altitude range do Nemea's vineyards sit?","roughly 200 to 850 metres",["roughly 50 to 200 metres","roughly 900 to 1400 metres","the zone is uniformly at 400 metres"],"That spread is the main reason a single-variety appellation produces such varied wine: the high sites retain acidity and ripen later."),z("weinberg",2,"Which soil type dominates Cephalonia, and which variety is it associated with?","limestone, with Robola",["volcanic ash, with Assyrtiko","schist, with Xinomavro","alluvial clay, with Agiorgitiko"],"The Ionian islands have a climate without the extremes of the Aegean, which shows in the style."),z("weinberg",3,"Why does altitude matter so much across Greek viticulture?","diurnal range at elevation preserves acidity in a hot climate",["it reduces the need for spraying","it allows mechanical harvesting","it raises potential alcohol"],"Much of Greece has hot dry summers. Many of the more highly regarded vineyards are consequently at elevation rather than on the coastal plain."),z("weinberg",3,"What is the composition of Santorini's aspa soils?","basalt, pumice, ash and sand, with very little clay",["deep red clay over limestone","granite sand over schist","chalk with flint"],"The low clay content is the key point: it drains hard, holds little water, and is what keeps phylloxera out."),z("keller",1,"What is Retsina?","wine flavoured with pine resin during fermentation",["wine aged in pine casks","wine from a grape called Retsina","wine fortified with pine spirit"],"The practice descends from resin-sealed amphorae. One source puts Retsina at roughly 10 to 15 % of total Greek production \u2014 treat that as an estimate rather than a firm figure."),z("keller",2,"Which three regulated styles sit under PDO Santorini?","dry Santorini, Nykteri and Vinsanto",["dry Santorini, Retsina and Vinsanto","Nykteri, Kouloura and Vinsanto","dry Santorini, sparkling and Vinsanto"],"Nykteri is the oak-finished dry style. The name refers to night work, from picking and pressing after dark."),z("keller",2,"How is Vinsanto's concentration achieved?","by sun-drying the grapes before fermentation",["by freezing the must","by adding grape spirit","by botrytis"],"This distinguishes it from fortified sweet wines such as Mavrodaphne of Patras, where spirit is added."),z("keller",3,"What does the Reserve specification require of a PDO white in terms of vessel?","at least six months in oak and six months in bottle, within a two-year minimum",["twelve months in oak only","no vessel requirement, only total time","eighteen months in stainless steel"],"Grand Reserve extends the total to three years for whites. The oak and bottle minima are what distinguish the tier from simple bottle age."),z("keller",2,"Where may a PDO wine legally be aged and bottled?","generally also outside the zone, with defined exceptions",["only within the delimited zone, without exception","only at the estate that grew the fruit","anywhere in the EU without restriction"],"Monemvasia-Malvasia is cited as an exception for bottling. The general permission is why some PDO wines are vinified by houses based elsewhere."),z("keller",3,"Amynteo was originally designated for which styles?","dry red and sparkling blanc de noirs",["dry white and ros\xE9","sweet red only","sparkling ros\xE9 only"],"Ros\xE9 came with the 1995 amendment. A blanc de noirs from Xinomavro is an unusual specification to find written into a 1972 designation."),z("keller",2,"Which two PDOs carry the Mavrodaphne name?","Patras and Cephalonia",["Patras and Rhodes","Cephalonia and Samos","Nemea and Patras"],"Both are sweet. Mavrodaphne is also planted for dry wine, though not under those designations."),z("keller",3,"What does the retained OPAP red neck band signal?","that the bottle is a dry appellation wine",["that it is a Reserve","that it was bottled at the estate","that it is for export"],"It survived the 2009 harmonisation as a bottle-level marker, which is why it still appears on wines now legally labelled PDO."),z("sorten",1,"By what nickname is Agiorgitiko sometimes known?","Blood of Hercules",["Tears of Zeus","Black of Nemea","Wine of Heracles' labour"],"The name ties the variety to Nemea, where Hercules killed the lion in the first of his labours. It is folklore attached to the place, not an official synonym."),z("sorten",3,"Agiorgitiko carries several documented synonyms. Which of these is one?","Mavro Nemeas",["Mavro Naoussis","Xinomavro Peloponnisou","Agiorgitis Attikis"],"Also Aghiorghitiko and St. George. Its VIVC number is 102."),z("sorten",3,"In which area is Agiorgitiko traditionally blended with Cabernet Sauvignon, and under what name?","around Metsovo, in a wine traditionally called katoi",["around Nemea, as Nemeatiko","on Crete, as kritiko","in Attica, as Savatiano rouge"],"This is a table-wine tradition rather than an appellation category."),z("sorten",2,"What is the conventional ageing expectation for a serious Naoussa Xinomavro?","ten years and more, developing slowly",["two to three years","drink within the first year","fifty years or more"],"Trade references give 10+ years, with the profile moving toward mushroom and tobacco leaf. The tannin structure is what carries it."),z("sorten",2,"How is Vidiano's style usually characterised?","textural rather than overtly aromatic, with a creamy mouthfeel and medium to high acidity",["piercingly aromatic and light-bodied","tannic and structured","neutral, for blending only"],"Descriptors given are stone fruit, flowers and sweet herbs. Ageing expectation is typically 3 to 4 years \u2014 it is generally drunk young."),z("sorten",3,"Which viticultural weaknesses are recorded for Vidiano?","sensitive to powdery mildew, moderately resistant to downy mildew",["highly susceptible to both mildews","prone to coulure and millerandage","very sensitive to frost"],"It also prefers dry, calcareous, well-drained soils of modest fertility, and is described as difficult to cultivate \u2014 which is why plantings stayed small."),z("sorten",2,"Roughly how many indigenous grape varieties does Greece have?","in the region of 300",["around 30","around 1000","around 80"],"The figure is an estimate that varies between sources. Only a handful \u2014 Assyrtiko, Agiorgitiko, Xinomavro, Moschofilero \u2014 have significant international presence."),z("sorten",3,"Which whites, besides Vidiano, are Cretan?","Vilana and Thrapsathiri",["Athiri and Aidani","Debina and Robola","Savatiano and Roditis"],"Vidiano is genetically close to both. Aidani and Athiri belong to the Cyclades and the Aegean; Savatiano and Roditis are mainland."),z("sorten",3,"Which two red varieties are associated with the Cyclades alongside Aidani?","Mavrotragano",["Limnio","Negoska","Krasato"],"Mavrotragano is one of the varieties that has drawn renewed attention from growers and sommeliers looking beyond the established four."),z("weinberg",2,"What proportion of Santorini's vineyard is Assyrtiko?","roughly 70 %",["roughly 30 %","roughly 95 %","roughly 45 %"],"The balance is largely Athiri and Aidani, the two varieties the appellation permits alongside it, plus red varieties including Mavrotragano."),z("weinberg",2,"What is the average vine age given for PDO Santorini?","over 70 years",["around 20 years","around 40 years","over 150 years for the whole appellation"],"Individual parcels well over 150 years exist, and are among the few self-rooted old vineyards left in Europe \u2014 but that is not the appellation average."),z("weinberg",3,"Across how many villages does PDO Nemea extend?","seventeen",["five","twenty-eight","forty"],"The count comes with the altitude range of roughly 200 to 850 metres. Sub-zoning of Nemea by altitude has been a live discussion in the appellation."),z("weinberg",3,"Against what three specific hazards does kouloura training protect the fruit?","wind, fierce sun and blown sand",["frost, hail and birds","fog, mildew and rot","salt spray, goats and erosion"],"All three follow from the site: an exposed Cycladic island with volcanic sand and no shelter."),z("weinberg",3,"Dalamara in Naoussa farms a single vineyard widely described in the international press as the appellation's closest thing to a grand cru. Which?","Paliokalias",["Ramnista","Yianakohori","Xinomavro Vieilles Vignes"],"Six hectares of the estate, at 240 to 300 metres on south-facing slopes, with vines over 85 years old. The estate dates to 1840 and has been certified organic since 1996."),z("keller",3,"Gaia Wines operates two wineries. Where?","Santorini and Nemea",["Santorini and Naoussa","Nemea and Mantinia","Crete and Santorini"],"Founded 1994 by Yiannis Paraskevopoulos, who holds a doctorate in oenology from Bordeaux, with the agronomist Leon Karatsalos. The two sites let the house work Assyrtiko and Agiorgitiko in parallel."),z("keller",3,"Which wine is generally credited as a benchmark that helped establish dry Greek white internationally?","Thalassitis Assyrtiko, launched 1994",["Retsina of Attica, relaunched 1985","Nykteri of Santo Wines, 1990","Malagousia of Gerovassiliou, 1981"],"The debut release was around 9600 bottles. Gerovassiliou's role was in reviving the Malagousia variety, which is a
