ng sehr lange nachhallen. Warum viel st\xE4rker als im Freien?","Der Schall kann nicht in alle Richtungen entweichen und wird an den W\xE4nden immer wieder reflektiert.",["Weil Schall im Tunnel schneller ist.","Weil die Luft im Tunnel dichter ist.","Weil im Tunnel keine D\xE4mpfung auftritt."],"Im Freien verteilt sich die Energie \xFCber eine immer gr\xF6ssere Kugelfl\xE4che. In einer R\xF6hre bleibt sie weitgehend beisammen und wird vielfach reflektiert \u2014 daher die lange Nachhallzeit.","Reflexion",["Wohin geht die Schallenergie im Freien, und was \xE4ndert sich in einer R\xF6hre?"]),()=>T(3,"Ein Lawinenversch\xFCtteten-Suchger\xE4t sendet auf 457 kHz. Warum nicht auf einer viel h\xF6heren Frequenz, die kleinere Antennen erlauben w\xFCrde?","Weil tiefere Frequenzen mit l\xE4ngerer Wellenl\xE4nge Schnee besser durchdringen.",["Weil h\xF6here Frequenzen zu schnell sind.","Weil 457 kHz die Eigenfrequenz von Schnee ist.","Weil Lawinen elektromagnetische Wellen erzeugen."],"Die Wellenl\xE4nge bei 457 kHz betr\xE4gt rund 660 m \u2014 sehr viel gr\xF6sser als jede Struktur im Schnee, der dadurch praktisch durchsichtig wird. Kurze Wellen w\xFCrden gestreut und absorbiert. Derselbe Grund, warum U-Boote auf L\xE4ngstwellen empfangen.","Licht",["Vergleiche die Wellenl\xE4nge mit der Gr\xF6sse der Hindernisse."]),()=>T(3,"Ein Alphorn hat keine Klappen und keine L\xF6cher. Wie erzeugt der Spieler trotzdem verschiedene T\xF6ne?","Er \xE4ndert die Lippenspannung und regt damit unterschiedliche Eigenschwingungen derselben Lufts\xE4ule an.",["Er ver\xE4ndert die L\xE4nge des Horns beim Spielen.","Er bl\xE4st unterschiedlich laut.","Das Alphorn kann nur einen Ton erzeugen."],"Nur die Naturt\xF6ne der festen Rohrl\xE4nge sind spielbar. Der elfte Naturton f\xE4llt zwischen unsere Halbt\xF6ne \u2014 er klingt f\xFCr gewohnte Ohren zu tief und heisst darum Alphorn-Fa. Ein Grenzfall, den die Musik dem Instrument nicht austreiben konnte.","Offene Pfeife",["Was bleibt beim Alphorn fest, und was kann der Spieler \xFCberhaupt ver\xE4ndern?"]),()=>T(3,"Warum sind die Doppler-Formeln f\xFCr bewegte Quelle und bewegten Beobachter verschieden \u2014 und warum ist das bei Licht ein Problem?","Beim Schall gibt es das Medium als Bezugssystem, das die beiden F\xE4lle unterscheidet; Licht hat kein solches Medium, deshalb darf dort nur die Relativgeschwindigkeit z\xE4hlen.",["Es ist nur eine N\xE4herung, in Wirklichkeit sind die Formeln gleich.","Bei Licht ist die Quelle immer in Ruhe.","Der Unterschied kommt von der viel gr\xF6sseren Lichtgeschwindigkeit."],"Genau hier hakt die Relativit\xE4tstheorie ein: da kein \xC4ther existiert, kann es beim Licht keinen messbaren Unterschied zwischen \xABQuelle bewegt sich\xBB und \xABBeobachter bewegt sich\xBB geben. Die relativistische Dopplerformel h\xE4ngt darum nur von der Relativgeschwindigkeit ab.","Dopplereffekt",["Frag dich: bewegt sich etwas relativ zu was?","Beim Schall gibt es die ruhende Luft als drittes Bezugssystem. Beim Licht nicht."]),()=>T(3,"Warum klingt eine gedeckte Pfeife hohler als eine offene gleicher Tonh\xF6he?","Weil bei ihr nur die ungeradzahligen Obert\xF6ne auftreten, die geradzahligen fehlen.",["Weil sie doppelt so lang ist.","Weil in ihr der Schall langsamer l\xE4uft.","Weil sie leiser klingt."],"Offen: f\u2080, 2f\u2080, 3f\u2080, 4f\u2080 \u2026 Gedeckt: f\u2080, 3f\u2080, 5f\u2080 \u2026 Das unterschiedliche Obertonspektrum ist genau das, was wir als Klangfarbe h\xF6ren.","Gedeckte Pfeife",["Vergleiche die beiden Formeln \u2014 welche Vielfachen der Grundfrequenz kommen jeweils vor?"]),()=>T(3,"Ein Ton geht von Luft in Wasser \xFCber. Was \xE4ndert sich?","Die Geschwindigkeit und die Wellenl\xE4nge \xE4ndern sich, die Frequenz bleibt gleich.",["Die Frequenz \xE4ndert sich, die Wellenl\xE4nge bleibt gleich.","Beide bleiben gleich.","Beide \xE4ndern sich unabh\xE4ngig voneinander."],"Die Frequenz wird von der Quelle vorgegeben und \xE4ndert sich beim Medienwechsel nicht \u2014 sonst k\x xB0C / 90 \xB0C) einen Wirkungsgrad von 85 %. Wo steckt der Fehler?","Es wurde in Grad Celsius statt in Kelvin gerechnet.",["Es wurde die falsche Formel benutzt.","Der Wirkungsgrad darf 100 % \xFCbersteigen.","Die Temperaturen wurden vertauscht."],"In Celsius erg\xE4be (620\u221290)/620 = 85 %. Richtig ist mit Kelvin (893.15\u2212363.15)/893.15 = 59.3 %. Celsius l\xE4sst den Wirkungsgrad viel zu gut aussehen.","Wirkungsgrad",["Rechne selbst nach \u2014 in welcher Einheit kommt gerade 85 % heraus?"]),()=>T(3,"Ein K\xFChlschrank steht offen in einer geschlossenen K\xFCche und l\xE4uft. Was geschieht mit der Raumtemperatur?","Sie steigt, weil der Kompressor zus\xE4tzlich elektrische Arbeit in W\xE4rme umsetzt.",["Sie sinkt, weil der K\xFChlschrank k\xFChlt.","Sie bleibt gleich, weil W\xE4rme nur verschoben wird.","Sie sinkt zuerst und bleibt dann konstant."],"Q_ab = Q_auf + W: der Schrank gibt hinten mehr ab, als er vorne aufnimmt. Die Differenz ist genau die Antriebsarbeit.","K\xFChlschrank",["Bilanziere die ganze K\xFCche als ein System. Was geht hinein, was hinaus?"]),()=>T(3,"Ein Sch\xFCler rechnet die Mischtemperatur von 1 kg Wasser bei 80 \xB0C und 1 kg bei 20 \xB0C und erh\xE4lt 60 \xB0C. Was ist schiefgegangen?","Bei gleichen Massen und gleichem Stoff muss das arithmetische Mittel herauskommen, also 50 \xB0C.",["Nichts, 60 \xB0C ist richtig.","Er hat die W\xE4rmekapazit\xE4t vergessen.","Er h\xE4tte in Kelvin rechnen m\xFCssen."],"Der Plausibilit\xE4tstest kostet zwei Sekunden: die Mischtemperatur liegt immer zwischen den Ausgangswerten und bei gleichen Massen genau in der Mitte.","Mischtemperatur",["Ohne zu rechnen: wo muss das Ergebnis ungef\xE4hr liegen?"]),()=>T(3,"Welche Absch\xE4tzung stimmt: eine Tasse Tee (0.2 kg) von 20 \xB0C auf 90 \xB0C erw\xE4rmen?","rund 60 kJ",["rund 600 J","rund 6 MJ","rund 6 kJ"],"Q = 4182\xB70.2\xB770 \u2248 58.5 kJ. Wer die Gr\xF6ssenordnung im Kopf hat, erkennt Tippfehler sofort.","Absch\xE4tzen",["Grob rechnen: 4000 \xB7 0.2 \xB7 70 \u2014 wie viele Nullen?"]),()=>T(3,"Warum gefriert Wasser in einer offenen Schale im warmen Zimmer nicht, obwohl Verdunsten k\xFChlt?","Die Verdunstungsk\xFChlung stellt sich mit dem W\xE4rmestrom aus dem Zimmer ins Gleichgewicht; dieser Punkt liegt \xFCber 0 \xB0C.",["Weil die Temperatur eines K\xF6rpers nie unter die Umgebungstemperatur sinken kann.","Weil Verdunsten \xFCberhaupt nicht k\xFChlt.","Weil Wasser im Zimmer immer w\xE4rmer wird."],"Verdunstungsk\xFChlung kann durchaus unter die Lufttemperatur f\xFChren \u2014 genau darauf beruht der feuchte Finger im Wind. Nur reicht es bei \xFCblicher Zimmerluft nicht bis zum Gefrierpunkt.","Verdunstung",["Es stellt sich ein Gleichgewicht ein. Zwischen welchen beiden Vorg\xE4ngen?"])]]},G=(e,n)=>({url:`https://www.leifiphysik.de/${e}`,titel:"LEIFIphysik",was:n}),Zn=(e,n)=>({url:`https://www.feynmanlectures.caltech.edu/I_${e}.html`,titel:`Feynman I-${e} (englisch)`,was:n}),on={"Harmonische Schwingung":{gebiet:"schwing",kurz:"Eine Schwingung, bei der die R\xFCckstellkraft proportional zur Auslenkung ist. Die Bewegung folgt dann einer Sinusfunktion.",formel:`F = \u2212D\xB7y
y(t) = A\xB7sin(\u03C9\xB7t + \u03C6\u2080)`,fehler:"Jede periodische Bewegung f\xFCr harmonisch halten. Ein springender Ball ist periodisch, aber nicht harmonisch.",tief:"Entscheidend ist nicht der Aufbau, sondern das Kraftgesetz. \xDCberall, wo die r\xFCcktreibende Kraft linear mit der Auslenkung w\xE4chst \u2014 Feder, Pendel bei kleinem Winkel, schwimmender K\xF6rper, Atom im Kristall, elektrischer Schwingkreis \u2014 kommt dieselbe Sinusfunktion heraus. Das ist der Grund, warum sich der Aufwand lohnt, diesen einen Fall gr\xFCndlich zu verstehen.",leifi:G("mechanik/mechanische-schwingungen","Grundwissen, Aufgaben und Quiz zu harmonischen Schwingungen"),lesen:Zn(21,"der Zusammenhang zwischen Kraftgesetz und Sinusschwingung \u2014 die Argumentation lohnt sich, die Analysis darf man \xFCberspringen"),wow:"Feder, Pendel, Molek\xFCl im Kristall, Schwingkreis im Radio: vier v\xF6llig verschiedene Dinge, eine einzige Gleichung. Wer sie einmal versteht, versteht alle vier."},"Kreisbewegung und Schwingung":{gebiet:"schwing",kurz:"Die harmonische Schwingung ist die Projektion einer gleichf\xF6rmigen Kreisbewegung auf eine Achse.",formel:`Kreis: Winkel \u03C9\xB7t

a_max = A\xB7\u03C9\xB2`,fehler:"Vergessen, dass \u03C9 quadriert wird. Bei doppelter Frequenz ist die Beschleunigung viermal so gross.",tief:"Die Beziehung a = \u2212\u03C9\xB2\xB7y ist die eigentliche Bewegungsgleichung. Sie sagt: die Beschleunigung ist zu jedem Zeitpunkt proportional zur Auslenkung und ihr entgegengerichtet. Jede Funktion, die das erf\xFCllt, ist eine Sinusschwingung \u2014 daher die Universalit\xE4t.",leifi:G("mechanik/mechanische-schwingungen","Geschwindigkeit und Beschleunigung bei Schwingungen"),wow:"Im Umkehrpunkt steht der K\xF6rper still und wird trotzdem am st\xE4rksten beschleunigt. Geschwindigkeit null heisst nicht Beschleunigung null."},Fadenpendel:{gebiet:"schwing",kurz:"Ein Massenpunkt an einem Faden. Die Periodendauer h\xE4ngt nur von L\xE4nge und Fallbeschleunigung ab, nicht von Masse oder Amplitude.",formel:"T = 2\u03C0\xB7\u221A(l/g)",fehler:"Meinen, ein schwereres Pendel schwinge langsamer. Die Masse k\xFCrzt sich heraus.",tief:"Die Amplitudenunabh\xE4ngigkeit gilt nur n\xE4herungsweise. Exakt ist die R\xFCckstellkraft \u2212m\xB7g\xB7sin \u03C6; erst die N\xE4herung sin \u03C6 \u2248 \u03C6 f\xFCr kleine Winkel macht daraus ein lineares Kraftgesetz. Ab etwa 15\xB0 wird die Periode merklich l\xE4nger als die Formel angibt \u2014 bei 90\xB0 schon um rund 18 %.",leifi:G("mechanik/mechanische-schwingungen/grundwissen/fadenpendel","alles zum Fadenpendel, mit Versuchen und Aufgaben"),wow:"Ein Pendel von 1 m schwingt hier in 2.0 s, auf dem Mond in 4.9 s. Ein Uhrmacher k\xF6nnte allein am Ticken h\xF6ren, auf welchem Himmelsk\xF6rper er steht."},Federpendel:{gebiet:"schwing",kurz:"Eine Masse an einer Feder. Die Periodendauer h\xE4ngt von Masse und Federkonstante D ab \u2014 und nicht von g.",formel:"T = 2\u03C0\xB7\u221A(m/D)",fehler:"Die Masse in Gramm einsetzen. Sie muss in Kilogramm stehen.",tief:"Der Unterschied zum Fadenpendel ist grunds\xE4tzlich: dort liefert die Schwerkraft die R\xFCckstellkraft, hier die Feder. Deshalb schwingt ein Federpendel auf dem Mond genau gleich wie auf der Erde, ein Fadenpendel dagegen deutlich langsamer.",leifi:G("mechanik/mechanische-schwingungen/grundwissen/federpendel","alles zum Federpendel, mit Versuchen und Aufgaben"),wow:"Auf der Raumstation wiegt nichts etwas \u2014 Astronauten bestimmen ihre Masse trotzdem, indem sie sich auf eine Feder setzen und die Schwingungsdauer messen."},"Energie der Schwingung":{gebiet:"schwing",kurz:"Die Gesamtenergie pendelt zwischen Spannenergie und kinetischer Energie hin und her; ihre Summe bleibt konstant.",formel:"E = \xBD\xB7D\xB7A\xB2 = \xBD\xB7m\xB7v_max\xB2",fehler:"Vergessen, dass die Energie mit dem Quadrat der Amplitude geht. Doppelte Amplitude heisst vierfache Energie.",leifi:G("mechanik/mechanische-schwingungen","Abschnitt \xABEnergiebetrachtung bei mechanischen Schwingungen\xBB"),wow:"Doppelte Amplitude bedeutet vierfache Energie \u2014 deshalb ist ein doppelt so hoher Wellengang f\xFCr ein Schiff nicht doppelt, sondern viermal so gef\xE4hrlich."},Resonanz:{gebiet:"schwing",kurz:"Wird ein schwingungsf\xE4higes System mit seiner Eigenfrequenz angeregt, w\xE4chst die Amplitude stark an.",fehler:"Resonanz mit \xDCberlagerung verwechseln. Es geht um die Frequenz der Anregung, nicht um zwei Wellen.",tief:"Bei jeder Anregung wird Energie zugef\xFChrt oder entzogen, je nachdem ob Anstoss und Bewegung im Takt sind. Nur bei der Eigenfrequenz wird bei jedem Zyklus zugef\xFChrt, und die Amplitude w\xE4chst, bis die D\xE4mpfung das Wachstum begrenzt. N\xFCtzlich beim Musikinstrument und beim Radioempf\xE4nger, gef\xE4hrlich bei Bauwerken.",leifi:G("mechanik/mechanische-schwingungen","Abschnitt \xABFederpendel angeregt\xBB zur Resonanz"),wow:"Dasselbe Prinzip, mit dem ein Weinglas beim richtigen Ton zerspringt, l\xE4sst dein Radio aus tausenden Sendern genau einen heraush\xF6ren."},"Grenzen des Modells":{gebiet:"schwing",kurz:"Jede Formel gilt in einem Bereich. Beim Pendel ist es der kleine Winkel, beim schwimmenden K\xF6rper die Bedingung, dass er nicht ganz untertaucht.",fehler:"Formeln ausserhalb ihres G\xFCltigkeitsbereichs anwenden, ohne es zu bemerken.",tief:"Die produktivste Frage zu jeder Formel lautet: unter welchen Annahmen wurde sie hergeleitet, und was passiert, wenn sie nicht mehr gelten? Beim schwimmenden K\xF6rper etwa ist die Auftriebskraft nur so lange proportional zur Auslenkung, wie die Querschnittsfl\xE4che gleich bleibt und er teilweise aus dem Wasser ragt. Taucht er ganz unter, bleibt der Auftrieb konstant \u2014 kein lineares Kraftgesetz mehr, keine harmonische Schwingung.",lesen:Zn(25,"\xA725-4 zeigt, wie weit dieselbe Gleichung durch die ganze Physik tr\xE4gt \u2014 gr\xF6sstenteils in Worten"),leifi:G("mechanik/mechanische-schwingungen/grundwissen/fadenpendel","der Hinweis am Artikelende erkl\xE4rt die Kleinwinkeln\xE4herung"),wow:"Galilei soll die Pendelgesetze an einer schwingenden Kirchenlampe entdeckt haben, den Takt mit seinem eigenen Puls gemessen. Uhren, die genau genug gewesen w\xE4ren, gab es noch nicht."},Bogenmass:{gebiet:"schwing",kurz:"Winkelmass, bei dem der Vollkreis 2\u03C0 betr\xE4gt. In allen Schwingungsformeln wird im Bogenmass gerechnet.",formel:`360\xB0 = 2\u03C0

so muss sich \u03BB = c/f anpassen. Genau darauf beruht die Lichtbrechung.",leifi:G("mechanik/mechanische-wellen","was die Quelle bestimmt und was das Medium")},"Akustisch und optisch":{gebiet:"wellen",kurz:"Schall ist eine mechanische Welle und braucht ein Medium; Licht ist elektromagnetisch und braucht keines.",formel:`c_Luft = 340 m/s

\u03B7_ideal = (T_hoch \u2212 T_niedrig)/T_hoch`,fehler:"In Grad Celsius rechnen \u2014 das l\xE4sst den Wirkungsgrad viel zu gut aussehen.",tief:"Dass der ideale Wirkungsgrad allein von den Temperaturen abh\xE4ngt und von nichts sonst, ist eine der \xFCberraschendsten Aussagen der Physik: weder Bauart noch Arbeitsstoff spielen eine Rolle. Carnot leitete das ab, indem er zeigte, dass eine bessere Maschine ein Perpetuum mobile zweiter Art erlauben w\xFCrde.",lesen:Zn(44,"\xA744-4: Carnots Argument ist logisch, nicht rechnerisch \u2014 das sch\xF6nste St\xFCck im ganzen Kapitel"),leifi:G("waermelehre/waermekraftmaschinen/grundwissen/ueberblick-ueber-waermekraftmaschinen","\xDCberblick \xFCber W\xE4rmekraftmaschinen und Wirkungsgrade"),wow:"Carnot fand die Grenze jeder W\xE4rmekraftmaschine, bevor irgendjemand wusste, was W\xE4rme \xFCberhaupt ist. Sie gilt bis heute f\xFCr jeden Motor, der je gebaut wurde oder je gebaut wird."},W\u00E4rmekraftmaschine:{gebiet:"thermo",kurz:"Nimmt W\xE4rme oben auf, wandelt einen Teil in Arbeit, gibt den Rest unten ab. Ohne kaltes Reservoir keine Arbeit.",formel:"Q_auf = W_nutz + Q_ab",fehler:"Glauben, Umgebungsw\xE4rme lasse sich vollst\xE4ndig in Arbeit umsetzen.",leifi:G("waermelehre/waermekraftmaschinen/grundwissen/ueberblick-ueber-waermekraftmaschinen","Aufbau und Grenzen der W\xE4rmekraftmaschine"),wow:"Es gibt keine Maschine, die Umgebungsw\xE4rme vollst\xE4ndig in Arbeit verwandelt. Nicht weil wir zu ungeschickt w\xE4ren \u2014 sondern weil es der zweite Hauptsatz verbietet."},W\u00E4rmepumpe:{gebiet:"thermo",kurz:"Dieselbe Maschine r\xFCckw\xE4rts: mit Arbeit wird W\xE4rme von kalt nach warm gehoben.",formel:"\u03B5 = T_hoch/(T_hoch \u2212 T_niedrig)",fehler:"Einen kleinen Temperaturhub f\xFCr unwichtig halten. Je kleiner er ist, desto gr\xF6sser \u03B5.",leifi:G("waermelehre/waermekraftmaschinen/grundwissen/waermekraftmaschine-kaeltemaschine-und-waermepumpe","W\xE4rmekraftmaschine, K\xE4ltemaschine und W\xE4rmepumpe im Vergle ,["nach einem lateinischen Wort f\xFCr Herzschlag","nach dem Ort der ersten Radio\xFCbertragung","nach dem Erfinder des Metronoms"],"Hertz hielt seine Entdeckung f\xFCr nutzlos: er sah keine Anwendung f\xFCr die Wellen. Wenige Jahrzehnte sp\xE4ter lief darauf der gesamte Funkverkehr.","Zugabe",[]),()=>T(1,"Was misst man am Genfersee bei CERN in einem 27 km langen Ring?","Teilchen, die auf nahezu Lichtgeschwindigkeit beschleunigt und zur Kollision gebracht werden",["die Kr\xFCmmung der Erdoberfl\xE4che","Neutrinos aus dem Erdinnern","die Ausdehnung des Sees \xFCber die Jahreszeiten"],"Der Ring liegt teils in Frankreich, teils in der Schweiz. Nebenbei entstand dort 1989 das World Wide Web \u2014 als Werkzeug, damit Physiker ihre Daten austauschen konnten.","Zugabe",[]),()=>T(1,"Seit 2019 ist das Kilogramm nicht mehr durch einen Metallzylinder in Paris definiert. Wodurch stattdessen?","durch das Plancksche Wirkungsquantum, eine Naturkonstante",["durch ein Kilogramm reines Wasser","durch die Masse eines Kohlenstoffatoms mal Avogadro","durch die Erdanziehung an einem Referenzort"],"Das Urkilogramm verlor \xFCber hundert Jahre rund 50 Mikrogramm \u2014 niemand wusste genau, warum. Heute h\xE4ngt jede Masse an einer Konstanten, die sich nicht ver\xE4ndern kann.","Zugabe",[]),()=>T(1,"Wie lange braucht Sonnenlicht bis zur Erde?","gut acht Minuten",["knapp eine Sekunde","etwa eine Stunde","etwa einen Tag"],"W\xFCrde die Sonne jetzt erl\xF6schen, merkten wir es erst in acht Minuten. Bis dahin schiene sie f\xFCr uns weiter, und die Erde liefe unbeirrt auf ihrer Bahn \u2014 auch die Gravitation breitet sich nicht schneller aus.","Zugabe",[]),()=>T(1,"Ein Mensch besteht \xFCberwiegend aus leerem Raum. Warum f\xE4llt man trotzdem nicht durch den Boden?","Weil die Elektronenh\xFCllen einander elektrisch abstossen.",["Weil die Atomkerne einander ber\xFChren.","Weil die Schwerkraft die Atome zusammenh\xE4lt.","Weil der Boden dichter gepackt ist als der K\xF6rper."],"Ein Atomkern verh\xE4lt sich zur Atomh\xFClle etwa wie eine Erbse zu einem Fussballstadion. Was wir Festigkeit nennen, ist fast ausschliesslich elektrische Abstossung.","Zugabe",[]),()=>T(1,"Warum sind Tage auf der Erde langsam l\xE4nger geworden?","Die Gezeitenreibung bremst die Erdrotation, und der Mond entfernt sich dabei.",["Die Erde wird durch Meteoriteneinschl\xE4ge schwerer.","Die Sonne zieht immer st\xE4rker an der Erde.","Die Erdachse richtet sich langsam auf."],"Vor 400 Millionen Jahren hatte das Jahr rund 400 Tage zu je 22 Stunden. Versteinerte Korallen haben Tagesringe \u2014 man kann es nachz\xE4hlen.","Zugabe",[]),()=>T(1,"Woher stammen die Atome, aus denen ein Mensch besteht?","Die leichten aus dem Urknall, die schwereren aus dem Inneren fr\xFCherer Sterne.",["Sie sind alle beim Urknall entstanden.","Sie bilden sich fortlaufend in der Erdatmosph\xE4re.","Sie stammen aus dem Erdkern."],"Wasserstoff ist so alt wie das Universum. Kohlenstoff, Sauerstoff und Eisen wurden in Sternen erbr\xFCtet und bei deren Tod verstreut. Jedes Eisenatom in deinem Blut war einmal Teil einer Supernova.","Zugabe",[]),()=>T(1,"Wie viele Atome enth\xE4lt ungef\xE4hr ein Teel\xF6ffel Wasser?","mehr als hundert Trilliarden, also \xFCber 10\xB2\xB3",["etwa eine Million","etwa eine Milliarde","etwa eine Billion"],"Es sind rund 5\xB710\xB2\xB3. Zum Vergleich: die Erde hat etwa 10\u2075\u2070 Atome, und im sichtbaren Universum stehen rund 10\xB2\xB2 Sterne. In einem Teel\xF6ffel Wasser stecken mehr Atome als es Sterne am Himmel gibt.","Zugabe",[]),()=>T(1,"Ein Basler Mathematiker berechnete im 18. Jahrhundert unter anderem, wie eine Saite schwingt, und pr\xE4gte Symbole wie e, i, \u03C0 und f(x). Wer?","Leonhard Euler",["Daniel Bernoulli","Jacob Steiner","Johann Heinrich Lambert"],"Euler verlor im Alter das Augenlicht und blieb dennoch der produktivste Mathematiker der Geschichte. Ein grosser Teil seiner Arbeiten entstand blind, diktiert.","Zugabe",[]),()=>T(1,"Warum kann man das Alter eines Baumes an seinen Ringen ablesen, das eines Gletschers aber an Eisschichten?","Beide zeichnen Jahreszeiten auf: Wachstum und Schneefall wechseln regelm\xE4ssig.",["Beide zerfallen radioaktiv mit bekannter Halbwertszeit.","Beide dehnen sich pro Jahr um einen festen Betrag aus.","Das ist Zufall, es gibt keinen gemeinsamen Grund."],"Eisbohrkerne aus der Antarktis reichen \xFCber 800\u2019000 Jahre zur\xFCck. Eingeschlossene Luftbl\xE4schen sind echte Proben uralter Atmosph\xE4re \u2014 man kann sie messen.","Zugabe",[]),()=>T(1,"Was passiert mit der Energie, wenn ein Auto bremst?","Sie wird \xFCberwiegend zu W\xE4rme in den Bremsscheiben.",["Sie verschwindet, sonst w\xFCrde das Auto nicht anhalten.","Sie wird in Schall umgewandelt.","Sie geht in die Reifen als Verformung \xFCber."],"Ein Elektroauto holt einen Teil davon zur\xFCck, indem der Motor als Generator arbeitet. Ganz zur\xFCck geht es nie \u2014 der zweite Hauptsatz nimmt seinen Anteil.","Zugabe",[]),()=>T(1,"Warum wiegt ein Kilogramm auf dem Mond weniger, ist aber trotzdem ein Kilogramm?","Die Masse bleibt gleich, nur die Gewichtskraft ist kleiner.",["Auf dem Mond gilt eine andere Definition des Kilogramms.","Ein Teil der Materie bleibt auf der Erde zur\xFCck.","Die Waage misst dort ungenau."],"Deshalb misst man im Weltall Massen \xFCber Schwingungen und nicht mit einer Waage \u2014 eine Federwaage zeigte dort schlicht nichts an.","Zugabe",[]),()=>T(1,"Welche Entdeckung machte man 1965 zuf\xE4llig, w\xE4hrend man eine Antenne von st\xF6rendem Rauschen befreien wollte?","die kosmische Hintergrundstrahlung, das Echo des Urknalls",["die Radiowellen des Jupiter","das Magnetfeld der Erde","die Existenz der Neutrinos"],"Penzias und Wilson hielten das Rauschen zuerst f\xFCr Taubendreck in der Antenne. Sie putzten sie gr\xFCndlich. Das Rauschen blieb \u2014 und brachte ihnen den Nobelpreis.","Zugabe",[]),()=>T(1,"Warum h\xF6rt man in einer klaren Winternacht Ger\xE4usche aus viel gr\xF6sserer Entfernung?","Kalte Luft am Bod
