ple of Poseidon",lon:24.02,lat:37.65,farbe:E.meer}],s0={mythos:{name:"History & Myth",zeichen:"\u2694"},meer:{name:"Sea & Animals",zeichen:"\u{1F419}"},essen:{name:"Food & Wine",zeichen:"\u{1F347}"},zahlen:{name:"Numbers & Records",zeichen:"\u2605"}};var c0=e=>e[Math.floor(Math.random()*e.length)],Fd=e=>{let t=[...e];for(let a=t.length-1;a>0;a--){let l=Math.floor(Math.random()*(a+1));[t[a],t[l]]=[t[l],t[a]]}return t};function h(e,t,a,l,n,i,u){return{ort:e,kat:t,stufe:a,frage:l,richtig:n,falsch:i,uebrigens:u}}var pl=[h("athen","mythos",1,"Who is the city of Athens named after?","the goddess Athena",["a king called Athenos","the Greek word for hill","a river"],"Athena and Poseidon competed for the city. Poseidon struck the rock and made a saltwater spring; Athena gave an olive tree. The people chose the tree \u2014 you can eat it."),h("athen","mythos",1,"What is the famous temple on the rock above Athens called?","the Parthenon",["the Colosseum","the Hagia Sophia","the Temple of Poseidon"],"It has stood on the Acropolis for about 2450 years. \u00abAcropolis\u00bb just means \u00abupper city\u00bb \u2014 every Greek town had one."),h("athen","zahlen",2,"Roughly how far is it from Zurich to Athens as the crow flies?","about 1600 km",["about 600 km","about 3000 km","about 5000 km"],"Two and a half hours by plane. On foot it would be around 400 hours \u2014 the ancient Greeks measured distances in days of walking."),h("athen","mythos",2,"Greek letters are still used today. Where does the word \u00abalphabet\u00bb come from?","from the first two letters, alpha and beta",["from a king named Alphabetos","from the Latin word for order","from the city of Alexandria"],"Greek was the first script to write down vowels. Before that only consonants were recorded and you had to guess the rest."),h("athen","essen",1,"What did Athena give the city, according to the myth?","an olive tree",["a grapevine","a lemon","a sheep"],"Olive trees live extraordinarily long. Some on Crete have stood for over two thousand years and still bear fruit."),h("athen","zahlen",3,"What do the words democracy, theatre, music and physics have in common?","They are all Greek",["They are all Latin","They were all coined in the Middle Ages","They all come from Arabic"],"Almost any English sentence about science is half Greek: mathematics, biology, technology, climate, energy, atom."),h("athen","meer",1,"Which bird belonged to the goddess Athena?","the owl",["the eagle","the dove","the raven"],"Hence \u00abcarrying owls to Athens\u00bb for doing something pointless \u2014 the city was full of them, on every coin."),h("athen","essen",2,"What is a souvlaki?","small skewers of meat, usually with pita",["a cold salad of tomato and cucumber","a thick soup of beans and tomato","a pastry soaked in honey syrup"],"The word simply means \u00ablittle skewer\u00bb. Greeks were grilling this way 3500 years ago \u2014 the stone grill stands were found at Akrotiri."),h("athen","mythos",1,"Which goddess was the Parthenon built for?","Athena",["Aphrodite","Hera","Artemis"],"Athena Parthenos \u2014 the maiden \u2014 which is where the building gets its name. A statue of her in gold and ivory once stood inside; it is long gone, and nobody today has seen it."),h("athen","mythos",2,"Who drove the building of the Parthenon?","Pericles",["Alexander the Great","Socrates","Solon"],"The architects were Iktinos and Kallikrates; the sculpture was overseen by Phidias. Work ran from 447 BC, with the decoration finished around 432."),h("athen","mythos",2,"What stood on the site before the Parthenon?","an earlier temple the Persians destroyed",["a marketplace at the top of the rock","the theatre where the tragedies were staged","nothing at all, the rock was left bare"],"The Persians sacked the Acropolis in 480 BC. The Athenians left the ruins standing for years as a reminder before deciding, in 448 BC, to rebuild."),h("athen","zahlen",3,"What paid for the Parthenon?","the treasury of the Delian League",["a tax on olive oil","the personal fortune of Pericles","tribute from Sparta"],"Money contributed by allied cities for defence against Persia went into a temple in Athens. The building was a political statement as much as a religious one, and contemporaries said so."),h("athen","zahlen",3,"Surviving building accounts show the single largest expense. What was it?","hauling the marble from Mount Pentelicus",["the gold for the statue","the wages of the sculptors","the timber for the roof"],"Sixteen kilometres, uphill at the end. Moving the stone cost more than carving it \u2014 which tells you something about ancient economies that no history of art will."),h("athen","zahlen",2,"How many columns stand along each long side of the Parthenon?","seventeen",["eight","twelve","twenty-four"],"Eight at each end and seventeen down each side. Counting the corners once, that is forty-six columns around the outside."),h("athen","mythos",3,"The Parthenon is Doric, but borrows from the other order. What is its best-known Ionic feature?","the continuous frieze running round the building",["the fluted columns","the triangular pediments","the marble roof tiles"],"A Doric temple would normally break the frieze into separate panels. The unbroken band of figures is an Ionic habit, and it is the part of the building most people picture."),h("athen","zahlen",3,"The Parthenon has almost no straight lines. What does the platform do?","it curves gently upward towards the middle",["it slopes down towards the entrance","it is perfectly flat","it tilts towards the south"],"The columns also swell at the midpoint and lean slightly inward. All of it exists to make the building look right to the eye, and none of it is visible to a casual visitor."),h("athen","mythos",2,"What happened to the Parthenon in the late sixth century AD?","it became a Christian church",["it was pulled down","it was buried by an earthquake","it was turned into a fortress"],"Dedicated to the Virgin Mary \u2014 still a temple to a maiden. After the Ottoman conquest in the fifteenth century it became a mosque. It has been in use for most of its 2400 years."),h("athen","mythos",2,"The Parthenon stood almost intact for over two thousand years. What wrecked it, on 26 September 1687?","a Venetian shell hit the gunpowder stored inside",["an earthquake","a lightning strike","a fire in the roof timbers"],"The Ottomans had moved their powder magazine into the temple, reckoning the Venetians would not fire on so famous a building. A mortar from the Hill of Philopappus proved them wrong."),h("athen","mythos",3,"After the explosion, the Venetian commander tried to take sculptures from the west pediment. What happened?","his lifting tackle gave way and the horses smashed on the rock",["he removed them intact to Venice","he was stopped by his own officers","the sculptures were already gone"],"So the same siege destroyed the building twice over: once by accident, once by greed."),h("athen","mythos",3,"The Venetian who shelled the Parthenon shares his name with the man behind the Lions Fountain in Heraklion. What is going on?","they are two different men of the same name, from the same Venetian family",["they are the same man","the fountain is named after the general","the name is a coincidence with no family link"],"Francesco Morosini is a name that turns up repeatedly in Venice's dealings with Greece. The fountain went up in Heraklion in 1628; the shell fell on the Acropolis in 1687."),h("athen","mythos",2,"On the Acropolis, which building carries six sculpted women in place of columns?","the Erechtheion",["the Parthenon","the Propylaia","the Temple of Athena Nike"],"The Caryatids. Those on the building today are copies \u2014 five originals are in the Acropolis Museum below, and the sixth is in London."),h("athen","mythos",3,"Why does the Erechtheion, rather than the Parthenon, mark the spot of the contest between Athena and Poseidon?","it was built over the marks the two gods left",["it is a good deal older than the Parthenon","it is the one temple on the rock facing the sea","the Parthenon was given over to Athena alone"],"The olive tree and the salt spring. The Erechtheion is the odd, asymmetric building on the north side \u2014 awkward in plan precisely because it had to accommodate several sacred spots at once."),h("athen","meer",2,"Why is the Parthenon's marble slowly turning to gypsum?","sulphur pollution reacts with the limestone in it",["salt spray carried up from the sea below","the roots of plants working into the joints","the hands of several million visitors a year"],"Marble is recrystallised limestone, and acid attacks it. The worst of the damage came in the twentieth century, and it is why the surviving sculptures were moved indoors."),h("elounda","mythos",1,"There is a small island with a fortress off Elounda. What is it called?","Spinalonga",["Santorini","Delos","Mykonos"],"Until 1957 people with leprosy lived there, cut off from the mainland. Today it is a museum \u2014 and one of the quietest places on Crete."),h("elounda","mythos",2,"In the shallow water at Elounda you can see walls below the surface. What are they?","the sunken ancient town of Olous",["a shipwreck","a modern fish farm","natural rock formations"],"The land has slowly subsided over the millennia. In calm water you can swim over the streets of a town that was dry ground 2000 years ago."),h("elounda","mythos",2,"There is a small lake in the middle of Agios Nikolaos. What did people once say about it?","that it had no bottom",["that it freezes in winter","that it is fresh water","that it is man-made"],"Locals said it reached down to the underworld. It is in fact a karst sinkhole \u2014 a limestone cave whose roof fell in long before there was anyone on Crete to watch. Legend also puts Athena and Artemis bathing there."),h("elounda","meer",1,"The bay is called Mirabello, from Italian. What does it mean?","beautiful view",["blue water","small harbour","windy place"],"The Venetians ruled Crete for about 450 years. That is why so many places there have Italian names."),h("elounda","meer",2,"Which very rare animal lives in hidden sea caves around Crete?","the monk seal",["the sea otter","the polar bear","the walrus"],"Somewhere between 800 and 1000 are left worldwide, most of them in Greek waters. Numbers have risen far enough that in 2023 the species was moved off the endangered list to merely vulnerable \u2014 and they are still so shy that most Greeks have never seen one."),h("elounda","essen",2,"What is taken from seawater in the shallow pans at Elounda?","salt",["sugar","drinking water","oil"],"Seawater is left in shallow pans until only the salt remains. The same physics as drying laundry, used the other way round."),h("elounda","meer",1,"Why is it easier to float in the Mediterranean than in a lake?","Salt water is denser and carries you better",["The water is warmer","It is shallower","There is no current"],"Salt makes water heavier, and heavier water lifts more. The Dead Sea holds so much that you cannot sink at all."),h("elounda","mythos",3,"Why does the ancient town near Elounda now lie under the sea?","The land has subsided",["A tsunami flooded it","It was deliberately flooded","Sea level rose by 50 m"],"Crete is slowly tilting: the west rises, the east sinks. Over two thousand years that adds up to several metres."),h("elounda","meer",2,"Which fish hides in rock crevices and is called \u00abrofos\u00bb in Greek?","the grouper",["the tuna","the herring","the salmon"],"Groupers can live over fifty years. Many begin life as females and become males later on."),h("elounda","essen",1,"What do you get free almost everywhere on Crete after a meal?","raki and something sweet",["coffee","wine","a soup"],"The grape spirit is called tsikoudia on Crete. Refusing it is close to rude \u2014 so is trying to pay for it."),h("elounda","zahlen",3,"Guidebooks give Lake Voulismeni as 64 m deep; a survey in 2000 found 48.8 m. Why?","the lake very likely grew shallower after the 1856 earthquake",["Captain Spratt simply measured it badly in 1852","the 2000 survey was done with the wrong instrument","part of the lake was deliberately filled in for the road"],"Spratt sounded 64 m for the Royal Navy in 1852. Four years later an earthquake with its epicentre 40 km away brought down the western corner of the lake. The old number is still copied into almost every guidebook."),h("heraklion","mythos",1,"Which monster lived in the labyrinth of Knossos, according to the myth?","the Minotaur",["the Cyclops","the Hydra","the Centaur"],"Half man, half bull. Theseus found his way out using Ariadne's thread \u2014 which is why we still talk about following a thread through a story."),h("heraklion","mythos",1,"Roughly how old is the palace of Knossos?","about 3500 years",["about 500 years","about 1000 years","about 10 000 years"],"When the palace was flourishing, Stonehenge was still in use and the pyramids were already old. The Minoans are Europe's earliest advanced civilisation."),h("heraklion","mythos",2,"Who excavated Knossos from 1900 and rebuilt parts of it?","Arthur Evans",["Heinrich Schliemann","Howard Carter","Indiana Jones"],"Evans had columns and frescoes reconstructed \u2014 in concrete. Experts still argue over whether that saved the ruin or falsified it."),h("heraklion","mythos",3,"The museum holds a clay disc stamped with 241 signs. What is remarkable about it?","Nobody can read it to this day",["It is solid gold","It shows a map of Crete","It was found only in 2010"],"The Phaistos Disc is about 3700 years old. Each sign was stamped separately \u2014 the oldest known use of movable type, four thousand years before Gutenberg."),h("heraklion","mythos",2,"The Lions Fountain in Heraklion is officially the Morosini Fountain. What is odd about the four lions?","They are older than the fountain itself",["They are made of gold","They are actually tigers","They were a gift from Italy"],"The fountain was built in 1628; the lions are roughly 300 years older and were reused. They have been pouring water for nearly four centuries."),h("heraklion","meer",1,"How many hearts does an octopus have?","three",["one","two","eight"],"Two pump blood through the gills, one through the body. And the blood is blue, because it carries copper instead of iron."),h("heraklion","meer",1,"The Cretaquarium at Gournes stands in an unusual place. What was there before?","a military base",["an airport","a monastery","a quarry"],"A barracks became one of Europe's largest aquariums, opened in 2005: about 2500 animals of some 250 species, all Mediterranean, in tanks holding 1.8 million litres between them."),h("heraklion","meer",2,"Which turtle lays its eggs on Greek beaches?","the loggerhead turtle",["the Galapagos giant tortoise","the snapping turtle","the European pond turtle"],"The female returns to the beach where she hatched \u2014 sometimes after twenty years and thousands of kilometres. How she finds it is still not fully understood."),h("heraklion","meer",3,"Warmer sand in a turtle nest produces mostly which sex?","females",["males","temperature makes no difference","only at full moon"],"Sex is decided in the nest and depends on temperature. That is exactly why warming beaches worry the specialists."),h("heraklion","meer",2,"Which wild animal lives only on Crete and climbs almost vertical cliffs?","the kri-kri, a wild goat",["the ibex","the mouflon","the chamois"],"By 1960 fewer than 200 were left; there are now around 2000, on Crete and three offshore islets. It appears in Minoan art, and DNA studies suggest it is not a wild species at all but a Neolithic domestic goat gone back to the wild."),h("heraklion","essen",2,"When you see octopus hanging on a line on Crete, what is happening?","It is being dried in the sun",["It is being dyed","It is on display for sale","It is being used as bait"],"Drying makes the flesh tender and keeps it. Before refrigeration, sunshine was the only preservation that cost nothing."),h("heraklion","mythos",2,"What does the most famous fresco from Knossos show?","young people leaping over a bull",["a naval battle","a king on his throne","the harvest"],"Whether bull-leaping was actually possible is still disputed. Attempts by gymnasts suggest: over the horns hardly, over the side perhaps."),h("heraklion","mythos",2,"The palace of Knossos had something Europe then lacked for 3000 years. What?","running water and drains",["glass windows","underfloor heating","a lift"],"Clay pipes, rainwater collection, even a flushing toilet. Not until the 19th century did European cities have anything comparable again."),h("heraklion","mythos",3,"The Minoans wrote in two scripts, Linear A and Linear B. What is true of Linear A?","It has never been deciphered",["It was deciphered and turned out to be Greek","It was never found","It consists only of numbers"],"Linear B was cracked in 1952 and proved to be early Greek. Linear A stays silent \u2014 we know the signs but not the language behind them."),h("heraklion","meer",1,"How many arms does an octopus have?","eight",["six","ten","twelve"],"It usually walks on two and uses six as arms. Each arm can act on its own \u2014 two thirds of its nerve cells are not in the head."),h("heraklion","meer",2,"Why can an octopus change colour in an instant?","It has colour cells in its skin that it controls directly",["It blushes when excited","The colour depends on the water","It rubs against rocks"],"And here is the puzzle: octopuses are probably colour-blind. How they still match their surroundings is one of the better open questions in marine biology."),h("heraklion","meer",2,"Which shark is the top predator of the Mediterranean?","the great white",["the blue shark, the commonest large shark here","the basking shark, much the biggest of them all","the hammerhead, which hunts along the shelf edge"],"The basking shark is larger but eats plankton. The Mediterranean has more than forty shark species and practically none is dangerous to people \u2014 most are shy and far smaller than you would think."),h("heraklion","meer",3,"Why is the Mediterranean saltier than the Atlantic?","More water evaporates than rivers and rain bring in",["There is salt on the seabed","The rivers carry salt","It is warmer"],"At Gibraltar, Atlantic water flows in at the surface and salty water flows out below. Without that strait the sea would dry out in a thousand years \u2014 which is exactly what happened five million years ago."),h("heraklion","essen",2,"Crete is known for a particular way of eating. What is at its centre?","olive oil, vegetables, pulses and little meat",["lots of meat and butter","rice and fish","bread and cheese"],"In the 1960s researchers noticed that Cretans lived strikingly long. That is where the term \u00abMediterranean diet\u00bb comes from \u2014 literally from this island."),h("heraklion","essen",1,"What is \u00abdakos\u00bb, found everywhere on Crete?","hard barley rusk with tomato and cheese",["fried squid rings","stuffed vine leaves","a honey pastry"],"The rusk is rock hard and briefly moistened. That way it kept for months \u2014 provisions for shepherds who stayed in the mountains for weeks."),h("heraklion","zahlen",2,"Roughly how many rooms did the palace of Knossos have?","about 1300",["about 30","about 130","about 13 000"],"Winding across several storeys, with light wells and staircases. That is very likely where the labyrinth legend began."),h("chalkida","meer",1,"Something strange happens in the strait at Chalkida. What?","The current reverses direction several times a day",["The water there is fresh, not salt at all","It freezes over for a few weeks each winter","No wind has ever been recorded in the strait"],"The Euripus turns roughly every six hours. Sometimes it grows restless and switches more than a dozen times in a day \u2014 even now it cannot be predicted exactly."),h("chalkida","mythos",3,"Which famous philosopher lived in Chalkida and studied the current?","Aristotle",["Plato","Socrates","Pythagoras"],"Legend says he threw himself in, despairing at the unsolved riddle. He did not \u2014 he died there of illness in 322 BC. But the story has lasted two thousand years."),h("chalkida","zahlen",2,"Euboea is Greece's second largest island. Which is the largest?","Crete",["Rhodes","Corfu","Lesbos"],"Euboea lies so close to the mainland that a short bridge is enough. Many Greeks hardly think of it as an island."),h("chalkida","essen",2,"The Avantis winery near Chalkida is named after something very old. What?","the Avantes, the ancient people of Euboea",["the river that crosses the Lelantine plain","the grandfather who planted the first vines","a grape variety grown nowhere else in Greece"],"Homer describes the Avantes in the Iliad as long-haired, fearless warriors from Chalkis and Eretria. Three thousand years later their name is on a wine label."),h("chalkida","essen",3,"In 1998 an Avantis wine made it into a well-known book. Which?","the Guinness Book of Records",["the Bible","a cookbook by Aristotle","the land registry of Euboea"],"Avantis Dryos, a white from the Malagousia grape. The record was not for the wine but for the labels: 3652 bottles, every one carrying a different drawing by the winemaker's architect brother. Malagousia itself had almost vanished in the 1970s and was saved by a handful of growers."),h("chalkida","essen",1,"What grows particularly well on the slopes around Chalkida?","vines",["coffee","rice","bananas"],"The vines sit between 250 and 500 metres. It cools down at night, and that is exactly what gives the wine its freshness."),h("chalkida","zahlen",2,"How do you get from Chalkida to the mainland?","over a bridge that slides sideways",["by ferry","through a tunnel","you cannot"],"The old bridge slides out of the way when a ship comes \u2014 usually in the middle of the night, when the current happens to be still."),h("chalkida","meer",3,"What drives the tidal switch in the Euripus?","the pull of the moon and sun",["underground springs","the wind","temperature differences"],"North and south of the strait the water rises at different times. Because only a 38-metre gap connects them, it races through \u2014 at up to nine knots."),h("chalkida","essen",2,"Avantis brought one nearly extinct Euboean grape back from the edge. Which?","Mavrokoudoura",["Malagousia","Assyrtiko","Agiorgitiko"],"A red variety from Kymi, a clone of Mandilaria with smaller, darker berries. Apostolos Mountrichas has said it was almost extinct at the start of this century and that he knew he had to bring it back."),h("chalkida","essen",3,"The Avantis vines grow at 250 to 500 metres. Why does that help the wine?","Cool nights preserve the freshness",["It rains more up there","The soil is deeper","It is closer to the sun"],"The gap between day and night temperature keeps acidity in the grape \u2014 and acidity is what makes a white wine feel alive."),h("chalkida","zahlen",1,"Roughly how far is Chalkida from Athens?","about 80 km",["about 8 km","about 300 km","about 800 km"],"A good hour by car. For Athenians it is the nearest sea \u2014 at weekends the bridge is busy."),h("chalkida","mythos",3,"Chalkida is named after a metal. Which?","copper, chalkos in Greek",["gold","iron","silver"],"Bronze was worked here long before iron arrived. An entire age is named after that alloy \u2014 and this town still carries its name."),h("heraklion","mythos",2,"How were the Minoan dead usually laid out for burial?","bound in a folded position, knees drawn up to the chin",["stretched out flat on the back","seated upright","cremated and the ashes buried"],"The body was then placed on the tomb floor, pushed into a large storage jar laid on its side, or put in a clay box. Almost all Minoan burial was inhumation \u2014 cremation only appears in a few graves near Knossos around 1600 BC, and those may belong to foreigners."),h("heraklion","mythos",3,"What is a larnax?","a clay coffin, used on Crete and almost nowhere else",["a stone altar on which offerings were burnt","a bronze mask laid over the face of the dead","a chamber tomb cut sideways into soft rock"],"Almost unknown elsewhere in the Bronze Age Aegean. Late Minoan examples have panelled sides and gabled lids and are painted all over; their shape suggests they were copied from wooden clothes-chests \u2014 occasionally a real chest was used, but only for the very wealthy."),h("heraklion","mythos",2,"Who was buried in a typical Early Minoan tomb?","a whole family, over several generations",["a single individual","only priests","only children"],"A small settlement might have just one tomb. Knossos was ringed by them. Over time the tombs shrank, and by around 1470 BC most held at most four members of a family."),h("heraklion","mythos",3,"The painted sarcophagus from Agia Triada, now in the Heraklion museum, is famous for what?","it shows the fullest surviving pre-Homeric sacrifice",["it is the only one anywhere made of solid gold","it names the prince who was buried inside it","it was found completely empty and never used"],"Found in 1903 near two tholos tombs, probably made for a prince. It mixes Minoan and Mycenaean elements with what looks like Egyptian influence."),h("heraklion","mythos",3,"At Anemospilia on Mount Juktas, three skeletons were found in a building destroyed by an earthquake. What did the excavators originally conclude?","that a human sacrifice had been interrupted",["that the building was a hospital","that the people had been executed","that they had died of plague"],"It became one of the most quoted claims in Minoan archaeology. Later reassessment reads the same evidence very differently \u2014 see the next question."),h("heraklion","mythos",3,"How do many archaeologists now read the Anemospilia evidence?","as an ordinary corpse laid out for burial",["as a human sacrifice, now confirmed beyond doubt","as a forgery planted by the excavators themselves","as a Roman burial some fifteen centuries later"],"On this reading the supposed altar was a wooden bier or a mould for a larnax, the weapon a ceremonial spearhead, and the uneven charring of the bones the work of the fire that followed the earthquake. A good example of how one dramatic interpretation can outlive the evidence for it."),h("heraklion","zahlen",3,"What was average life expectancy in Minoan Crete, as estimated from skeletal remains?","around 35 for men and 28 for women",["around 60 for both","around 20 for both","around 45 for women and 30 for men"],"Childbirth accounts for much of the difference. Figures like these are averages across all who reached adulthood, and rest on the bones that happen to have survived."),h("chalkida","mythos",2,"Which river runs through the plain between Chalkida and Eretria?","the Lilas",["the Evinos","the Sperchios","the Asopos"],"In antiquity it was the Lelantos, and the plain takes its name from it \u2014 though ancient commentators preferred to credit an otherwise unknown king called Lelantos."),h("chalkida","mythos",3,"The Lilas probably served what purpose between two ancient cities?","it was the natural border between Chalkida and Eretria",["it powered their mills","it carried their trade to the sea","it supplied Athens with drinking water"],"The river crosses the plain from north to south. Both cities claimed the land, and the dispute grew into the Lelantine War at the end of the eighth century BC."),h("chalkida","mythos",3,"What did Thucydides find remarkable about the Lelantine War?","it was the only early war in which other cities took sides",["it dragged on a hundred years without a battle","not a single man was killed on either side","it was fought entirely at sea and never on land"],"Herodotus records that Samos backed Chalkida and Miletus backed Eretria. Historians still argue over the dates, the alliances, and how much of it happened at all."),h("chalkida","mythos",3,"According to tradition, what did the peace terms of the Lelantine War forbid?","the use of missile weapons in any future fighting between them",["the building of ships","the export of wine","marriage between the two cities"],"An agreement to fight only at close quarters, if the tradition is sound. It is one of the earliest recorded attempts to set rules on how a war may be conducted."),h("chalkida","mythos",3,"Hesiod mentions crossing to Chalkida in his poetry. What for?","funeral games, where he won a tripod",["to buy bronze","to consult an oracle","to escape a famine"],"In Works and Days he says it was the only sea crossing he ever made. The games were for Amphidamas, whom a later source names as a Chalkidian killed in the fighting over the plain."),h("chalkida","essen",3,"A Venetian document of 1439 complains about the misuse of the plain's irrigation water, calling the place what?","the eye and garden of Euboea",["the granary of Venice","the vineyard of the Aegean","the mouth of the island"],"Under Venetian rule the plain was known as Lilanto. The complaint was that the powerful were taking more than their share, leaving plots unwatered \u2014 the same argument, six centuries on, that irrigation disputes still turn on."),h("chalkida","zahlen",2,"Paliouras, in the municipality of Chalkida, is what?","a village in the hills, at about 170 m",["a beach on the Euboean Gulf","a small island","a district of Chalkida town"],"Its population was 591 at the 1991 census, down from 679 ten years earlier \u2014 a pattern common to inland Greek villages through that period."),h("chalkida","zahlen",3,"Beyond Paliouras, the road towards the coast at Vythouri turns into what?","a dirt track of five or six kilometres",["a tunnel","a toll road","a ferry crossing"],"Which is precisely why that stretch of coast stays quiet. The route runs from Nea Artaki through Steni Dirfyos and Kathenoi before reaching the village."),h("chalkida","meer",1,"What does the beach name Alykes mean?","salt pans",["white sands","shallow water","the crossing"],"The same word turns up wherever seawater was once evaporated for salt \u2014 including at Elounda on Crete. It is one of the most common coastal place names in Greece."),h("chalkida","meer",2,"The Alykes beach at Drosia has a second name. What is it?","Ippokampos, the seahorse",["Delfini, the dolphin","Chelona, the turtle","Foka, the seal"],"A kilometre of fine sand, up to fifty metres wide, shallow a long way out \u2014 which is why it fills with families. It holds a Blue Flag."),h("chalkida","meer",2,"Alykes faces northwest across which stretch of water?","the North Euboean Gulf",["the Saronic Gulf","the Aegean proper","the Corinthian Gulf"],"Mount Messapion, also called Chtypas, rises just beyond the end of the beach; steep Mount Kandili stands on the far side of the gulf. The northwest aspect is what makes the sunsets there worth staying for."),h("chalkida","meer",3,"Why does the sea at Alykes stay shallow so far out?","the seabed slopes very gently",["a reef holds back the deep water","the tide never comes in","the sand is dredged each year"],"A gentle gradient over fine sand. It is the same feature that makes a beach safe for small children and useless for diving."),h("sounio","mythos",1,"Which god is the temple at Cape Sounion dedicated to?","Poseidon",["Zeus","Apollo","Hermes"],"The god of the sea got the temple you see first from the water. For sailors coming home it was the sign that Athens was near."),h("sounio","mythos",2,"Why is the sea around Greece called the Aegean?","after King Aegeus, who threw himself from this cliff",["after the sea nymph Thetis, mother of Achilles","after the island town of Aegina in the gulf","from an old word for the colour of deep water"],"His son Theseus was to hoist white sails if he had beaten the Minotaur. He forgot, his father saw black, and jumped. That is the story the Greeks told \u2014 scholars have proposed other roots too, among them aiges, a word that means both goats and waves."),h("sounio","zahlen",2,"Roughly how old is the Temple of Poseidon?","about 2460 years",["about 500 years","about 1000 years","about 5000 years"],"Built around 440 BC on the remains of an older temple the Persians had destroyed. About fifteen of the original columns still stand."),h("sounio","mythos",3,"A name is carved into one column, traditionally attributed to a famous English poet. Who?","Lord Byron",["William Shakespeare","Charles Dickens","Oscar Wilde"],"He visited in 1810 and the signature is still shown to visitors. Travellers carved their names freely then; Byron later died in Greece, fighting for its independence."),h("sounio","meer",2,"Wide meadows of one plant grow on the seabed off Sounion. What is it?","Neptune grass, Posidonia in Greek",["a seaweed that drifts in from the Atlantic","a cold-water coral that builds low reefs","a sponge once harvested by Greek divers"],"It is named after Poseidon himself. These meadows make oxygen, hold the sand in place and shelter countless young fish \u2014 and a single plant can be thousands of years old."),h("sounio","meer",1,"Which sound belongs to a Greek summer?","the chirping of cicadas",["croaking frogs","howling wolves","belling deer"],"Only the males sing, using a drum on the abdomen. They reach up to 100 decibels \u2014 about as loud as a pneumatic drill close by."),h("sounio","zahlen",3,"Why was the temple built on this particular cliff?","so that sailors could see it from far off",["because the best stone was there","because of fresh water","because it is never windy there"],"Sixty metres above the water. Anyone sailing to Athens from the south saw the columns first \u2014 and knew the voyage was nearly over."),h("sounio","mythos",2,"Besides Poseidon, another deity had a temple at Cape Sounion. Who?","Athena",["Aphrodite","Ares","Dionysus"],"The two who had competed over Athens stood side by side here. Almost nothing of the Athena temple remains."),h("sounio","zahlen",2,"What is the Temple of Poseidon made of?","marble from the surrounding area",["granite from Egypt","limestone from Crete","brick"],"From the Agrileza quarry, about four kilometres north. Athens used Pentelic marble for the Parthenon; here they took local stone, which stands up better to salt-laden wind."),h("sounio","zahlen",3,"The columns at Sounion were cut with 16 flutes instead of the usual 20. Why?","less surface exposed to wind and salt spray",["to save stone","to make them look thicker","the quarry could not cut finer"],"A building detail that is really a maintenance decision. Of the 34 original columns, about fifteen still stand \u2014 four of those on the north side were re-erected in the 1950s."),h("sounio","meer",2,"Why does the sea suddenly look golden at sunset?","The light comes in low and the air scatters the blue away",["The water itself changes colour as it cools","It is the pale sand on the seabed showing through","The moon is already up and reflecting on it"],"The same thing that makes the sky blue makes the evening sun red: in the evening the light travels much further through the air. Sounion is one of the best places in Greece to watch it."),h("sounio","meer",3,"Neptune grass meadows store one thing remarkably well. What?","carbon, more than rainforest of the same area",["salt, which it draws out of the seawater","oxygen, held as bubbles among the roots","fresh water, released slowly through the year"],"One plant in the Mediterranean has been estimated at over a hundred thousand years old \u2014 it keeps growing as a clone. That puts it among the oldest living things anywhere."),h("sounio","essen",2,"What arrives on a Greek table without being ordered?","bread and water",["dessert","cheese","coffee"],"The bread is usually on the bill, the water is not. Tap water is drinkable in Athens and gladly brought \u2014 on some islands, less so."),h("sounio","mythos",3,"Why are only columns left of the temple, and no roof?","The blocks were carted off as building material",["An earthquake brought the whole roof down","It was never finished and never had a roof","Lightning set the roof timbers alight one summer"],"Almost every ancient ruin was used as a quarry. That any columns still stand is usually down to their size \u2014 they were too heavy to carry away."),h("chalkida","zahlen",1,"How narrow is the Euripus where the old bridge crosses it?","about 38 metres",["about 380 metres","about 4 metres","about 2 kilometres"],"That is roughly the length of a swimming pool. All the water moving between the northern and southern Euboean Gulf has to squeeze through it, which is exactly why the current runs so hard."),h("chalkida","mythos",2,"How does the old bridge get out of a ship's way?","it slides sideways",["it lifts straight up","it splits in the middle and rises","it is dismantled each time"],"Earlier versions swung on a pivot. The present one, built in 1962, slides \u2014 which is why locals call it simply the sliding bridge."),h("chalkida","mythos",3,"Tradition dates the first bridge here to 411 BC. What is the difficulty with that?","neither Thucydides nor Xenophon mentions it, though both cover the period",["the date is confirmed by an inscription","there was no strait then","the Romans recorded it instead"],"The story goes that Chalkida broke with Athens, allied with Thebes, and bridged the strait with towers at either end. Plausible, widely repeated, and not actually attested in the historians who were writing at the time."),h("chalkida","mythos",3,"Which emperor is said to have replaced the fixed bridge with a movable one, around 540 AD?","Justinian",["Constantine","Hadrian","Augustus"],"A bridge that has to open is an admission that the water below matters more than the road above. It has been opening, in one form or another, for fifteen centuries."),h("chalkida","mythos",3,"Venetian rule left Chalkida with a name that stuck for centuries. Which?","Negroponte",["Castelnuovo","Porto Rosso","Santa Maria"],"It attached itself to the whole island. One account derives it from a bridge called the black bridge; another traces it through Euripos to Egripo to Negroponte, with the ending simply meaning bridge."),h("chalkida","zahlen",2,"The swing bridge that served Chalkida for some 65 years came from where, and opened when?","Italy, in 1896",["Britain, in 1850","Germany, in 1920","France, in 1870"],"Forty metres of steel, opened by hand. To install it the strait was deepened to 8.5 metres and widened \u2014 and a three-arched stone bridge and two Venetian towers were demolished to make room."),h("chalkida","zahlen",2,"How many bridges connect Euboea to the mainland at Chalkida?","two",["one","four","none, only ferries"],"The old sliding bridge in the middle of town, and the high cable-stayed bridge to the south, opened in 1993 with a main span of 215 metres."),h("chalkida","meer",3,"On how many days a month does the Euripus current behave irregularly?","about six or seven",["none, it is always regular","about twenty","every day"],"On the other twenty-two or twenty-three it turns roughly every six hours like an ordinary tide. On the awkward days it can change direction as often as fourteen times in twenty-four hours."),h("chalkida","mythos",3,"Plato uses the Euripus in the Phaedo as an image for what?","minds that swing back and forth and settle on nothing",["the passage of the soul after death","the movement of the stars","the flow of time"],"Socrates is describing people who conclude that nothing is sound or stable. The strait had already become a byword for changeability."),h("chalkida","mythos",3,"The Chalcidian alphabet, a western variant of Greek, mattered far beyond Euboea. Why?","it went to Italy and lies behind the Latin alphabet",["it was the first anywhere to write down vowels","it was used for coins and for nothing else","Athens had it banned throughout the empire"],"By way of Kyme in southern Italy and the Etruscans. The letters on this screen have a family connection to a town on the Euripus."),h("heraklion","mythos",2,"What is unusual about Minoan columns?","they are wider at the top than at the bottom",["they are square","they have no capital","they are made of solid gold"],"The opposite of a Greek column, and it makes the shape instantly recognisable. The originals were wood \u2014 cypress \u2014 so nothing survives but the stone bases and the paintings."),h("heraklion","mythos",3,"Why might Minoan columns taper downwards?","the trunk was set upside down so it could not sprout",["it used rather less timber for the same height","it made the rooms look taller than they were","their religion is known to have required it"],"Upside down it cannot take root, and water will not sit at the base. Nobody knows: it is a reasonable guess about a practical problem, not a documented reason \u2014 the Minoans left no text explaining themselves."),h("heraklion","mythos",2,"What colour were Minoan columns usually painted?","red, often with a black base and capital",["white","blue","left as bare wood"],"The reconstructions at Knossos are concrete, painted to match traces of pigment found on site. What you photograph there is a modern building following an ancient guess."),h("heraklion","mythos",3,"Minoan painters worked in true fresco. What does that mean?","the pigment goes on while the plaster is still wet",["the paint is bound with egg yolk before use","the wall is carved first and then coloured in","the finished panel is baked hard in a kiln"],"It binds into the wall itself. That means working fast, before the plaster sets, with no chance to correct anything \u2014 one reason Minoan figures are drawn with such economy."),h("heraklion","mythos",3,"In Minoan painting, men and women are given different skin colours. Which way round?","men reddish-brown, women white",["men white, women reddish-brown","both green","both the same shade"],"A convention shared with Egyptian painting. It is how figures are identified as male or female when nothing else in the image makes it clear."),h("heraklion","mythos",3,"How much of the famous Knossos frescoes is actually ancient?","often only fragments, the rest painted in later",["all of it, they came through the fire intact","none of it, they are entirely twentieth-century","only the outlines \u2014 the colour is all original"],"Evans employed the Gilli\u00e9ron father and son to reconstruct them. Much of what the world pictures as Minoan art is early twentieth-century painting built around a few genuine pieces \u2014 and the restorers made choices that have shaped the picture ever since."),h("heraklion","meer",2,"Which sea creature appears in one of the best-known frescoes from Knossos?","the dolphin",["the shark","the whale","the crab"],"In the room Evans named the Queen's Megaron. Sea life runs right through Minoan art \u2014 octopus, fish, argonauts, sea urchins \u2014 from a people whose power rested on ships."),h("heraklion","mythos",2,"Frescoes buried by the eruption on Thera survive far better than those on Crete. Why?","volcanic ash sealed and protected them",["they were painted on stone","they were kept indoors","they were repainted regularly"],"At Akrotiri whole walls survive, with swallows, lilies, boxing boys and a fleet of ships. Buried by the disaster that has been blamed, on and off, for the end of Minoan Crete."),h("sounio","mythos",1,"How many gods sit on Olympus in the usual count?","twelve",["seven","twenty","three"],"The list is not quite fixed. Hestia, goddess of the hearth, is sometimes replaced by Dionysos \u2014 one version says she gave up her seat to him rather than see the gods quarrel."),h("sounio","mythos",2,"Which of these is not an Olympian?","Hades",["Hera","Hephaestus","Demeter"],"He rules the dead and stays below. That is the point of the division: he took the underworld and does not sit at the table on Olympus."),h("sounio","mythos",2,"How did Zeus, Poseidon and Hades divide the world?","they drew lots",["Zeus chose first as the eldest","they fought for it","their mother decided"],"Zeus drew the sky, Poseidon the sea, Hades the underworld. Earth and Olympus itself were left common to all three, which is why the brothers keep getting in each other's way."),h("sounio","mythos",2,"Which epithet belongs to Poseidon?","the Earth-Shaker",["the Cloud-Gatherer","the Far-Darter","the Lame One"],"The Greeks put earthquakes at his door as well as the sea. Cloud-Gatherer is Zeus, Far-Darter is Apollo, and the Lame One is Hephaestus."),h("sounio","mythos",2,"Besides the dolphin, which animal is most closely tied to Poseidon?","the horse",["the eagle","the owl","the wolf"],"He was worshipped as Poseidon Hippios and credited with creating the horse. Pegasus is his son, born from Medusa when Perseus cut off her head."),h("sounio","mythos",3,"Who made Poseidon's trident?","the Cyclopes",["Hephaestus alone","the Titans","Poseidon himself"],"The same workshop that gave Zeus his thunderbolt and Hades his helmet of invisibility, as payment for being freed from Tartarus."),h("sounio","mythos",3,"Whom did Poseidon marry?","Amphitrite, a sea nymph",["Hera","Aphrodite","Persephone"],"She fled from him and hid; a dolphin found her and talked her round, and Poseidon set the dolphin among the stars for it."),h("sounio","mythos",3,"Why does Poseidon pursue Odysseus through the Odyssey?","Odysseus blinded his son, the Cyclops Polyphemus",["Odysseus refused him a sacrifice","Odysseus sank one of his temples","Odysseus insulted Amphitrite"],"And made it worse by shouting his own name from the departing ship. Ten years of storms follow from a moment of boasting."),h("sounio","mythos",3,"A bull sent by Poseidon lies behind the story you met at Knossos. How?","Minos failed to sacrifice it, and the Minotaur followed",["the bull dug the foundations of the palace","it was the bull that carried Europa to Crete","Theseus killed it on the beach the day he landed"],"Poseidon made Minos's wife fall in love with the animal. The god of the sea at Sounion and the monster in the labyrinth at Knossos belong to the same story \u2014 Greek myth is a small world with long consequences."),h("sounio","mythos",2,"Which contests did Poseidon lose besides the one for Athens?","he claimed Argos and Corinth too, and did not keep them",["none \u2014 Athens was the only one he ever lost","he lost Sparta to Ares after a long dispute","he lost Delphi to Hermes and never forgave it"],"Argos went to Hera; at Corinth he had to share. He was not a good loser: after Athens, the story goes, he flooded the plain."),h("sounio","mythos",1,"What is Poseidon called in Roman myth?","Neptune",["Mars","Mercury","Jupiter"],"Zeus becomes Jupiter, Hera Juno, Athena Minerva, Aphrodite Venus. The planets carry the Roman names, which is why the eighth one is Neptune."),h("sounio","zahlen",3,"Which games were held in Poseidon's honour?","the Isthmian Games at Corinth",["the Olympic Games","the Pythian Games","the Nemean Games"],"Olympia belonged to Zeus, Delphi to Apollo. Corinth sits on the isthmus between two seas, which made it the obvious place to honour him."),h("heraklion","mythos",1,"What did Ariadne give Theseus before he entered the labyrinth?","a ball of thread",["a sword of gold","a map","a magic cloak"],"Our word \u00abclue\u00bb comes from it. A clew was a ball of thread, and the sense of something that leads you out of a puzzle comes straight from this story."),h("heraklion","mythos",2,"Whose daughter was Ariadne?","Minos and Pasipha\u00eb's",["Daedalus's","Aegeus's","Poseidon's"],"Which makes the Minotaur her half-brother, since Pasipha\u00eb bore it after Poseidon's bull. She helped kill him for a stranger she had just met."),h("heraklion","mythos",3,"Who is said to have told Ariadne about the thread?","Daedalus, who had built the labyrinth",["Poseidon","Theseus himself","Minos"],"The architect gave away the flaw in his own design. It is why Minos shut him in it afterwards \u2014 the maze was too good to escape without inside knowledge."),h("heraklion","mythos",2,"What else had Daedalus built for the royal house of Crete?","the wooden cow for Pasipha\u00eb",["the palace of Knossos","the fleet of Minos","the walls of the city"],"Which is how the Minotaur came to exist at all. Daedalus is responsible for the problem and for the building that contains it, and then for the escape."),h("heraklion","mythos",3,"According to Plutarch, how often did Athens have to send its tribute of youths to Crete?","every nine years",["every year","every generation","only once"],"Seven boys and seven girls. Other sources say annually \u2014 the ancient accounts do not agree, and there is no way to settle it."),h("heraklion","mythos",3,"How was Daedalus finally tracked down after escaping Crete?","Minos set a puzzle only Daedalus could solve",["a sailor from Crete recognised him in the street","he wrote home to his family and was intercepted","Icarus was found alive and gave his father away"],"Minos toured the courts offering a reward to anyone who could thread a spiral seashell. Daedalus did it with an ant and a thread \u2014 and by solving it, gave himself away."),h("athen","mythos",2,"How did Aegeus arrange to recognise his son one day?","he left a sword and sandals under a rock for the boy to lift",["he gave the boy's mother a ring to keep","he had the child marked with a tattoo at birth","he left a sealed letter to open at sixteen"],"Theseus was raised in Troezen and had to move the rock before he could set out. A test of strength standing in for a birth certificate."),h("athen","mythos",3,"Theseus chose the dangerous land route to Athens. Whom did he deal with on the way?","Procrustes, who made travellers fit his bed",["the Sphinx, who set him an impossible riddle","the lion of Nemea, which no weapon could wound","Cerberus, the dog at the gate of the underworld"],"Too short and he stretched them, too tall and he cut. We still call an argument procrustean when the evidence is trimmed to fit the conclusion."),h("athen","mythos",3,"Theseus is given two fathers in the tradition. Who?","Aegeus and Poseidon",["Aegeus and Zeus","Minos and Poseidon","Aegeus and Hades"],"Not a contradiction the Greeks felt any need to resolve. It also gives the story its symmetry: the son of the sea god sails to Crete to kill the offspring of the sea god's bull."),h("athen","mythos",2,"What did Theseus do after returning to Athens, according to tradition?","he united the towns of Attica into one state",["he founded Sparta","he built the Parthenon","he sailed for Troy"],"The synoecism. Athens celebrated it long afterwards, which tells you the story was as much political charter as legend."),h("sounio","mythos",2,"What was Theseus supposed to do on the voyage home?","hoist white sails if he had survived",["send a messenger ahead","light a beacon","fire an arrow"],"He forgot. Whether from grief over Ariadne or simple carelessness depends on who is telling it \u2014 and the story works either way."),h("sounio","mythos",3,"Where did Aegeus throw himself, seeing the black sails?","accounts disagree \u2014 the Acropolis or the cliff here",["from Sounion, and every source agrees on it","from the Acropolis, and nobody has ever doubted it","nowhere \u2014 he died of grief quietly in his bed"],"Pausanias puts him on the Acropolis. The Sounion version is the one told at Sounion. Both are old, and the sea carries his name either way."),h("sounio","mythos",3,"What became of Ariadne after Theseus left her on Naxos?","Dionysos found her and married her",["she returned to Crete","she became a priestess of Athena","she was never heard of again"],"Her wedding crown was set among the stars as the Corona Borealis. She is abandoned by a hero and taken up by a god \u2014 a better ending than the one Theseus gave her."),h("alle","mythos",1,"What were the wings of Daedalus and Icarus made of?","feathers held with wax",["silk and cane","bronze sheets","eagle skins"],"Which is the whole trouble: a material chosen for lightness that cannot take heat."),h("alle","mythos",2,"Icarus was warned about two dangers, not one. What was the second?","flying too low, where spray would soak the feathers",["flying after dark, unable to see the water","flying over land, where the hunters had bows","flying faster than the wings were built to take"],"The story is usually told as a warning against ambition. It is just as much a warning against caution \u2014 the safe-looking option would have drowned him too."),h("alle","mythos",3,"Where did Daedalus land after the flight?","Sicily",["Egypt","Athens","Rhodes"],"He was taken in by King Cocalus. When Minos came after him, the king's daughters are said to have killed the visitor with boiling water in his bath."),h("alle","mythos",3,"Why was Daedalus exiled from Athens in the first place?","he killed his nephew, who was outdoing him as an inventor",["he was caught stealing from a temple of Athena","he refused a direct order from the king","he lost a case at law and could not pay"],"The boy is said to have invented the saw after looking at a fish's spine. Athena caught him as he fell and turned him into a partridge \u2014 a bird that has never since been willing to fly high."),h("elounda","mythos",2,"Spinalonga was not always an island. How did it become one?","the Venetians cut it away from the peninsula",["an earthquake split it off","the sea level rose","it always was one"],"They carved a channel to make a fortress that could not be walked to. Its official Greek name is Kalydon, though almost nobody uses it."),h("elounda","mythos",3,"Where does the name Spinalonga probably come from?","Venetians mangling \u00abstin Olounda\u00bb, meaning at Olous",["Italian for long thorn, after the shape of it","the admiral who first fortified the island","the long spine of rock the fortress sits on"],"Olous is the sunken town in the shallows nearby. Another reading takes it straight from Italian \u2014 the two explanations have coexisted for centuries."),h("elounda","mythos",3,"Crete fell to the Ottomans in 1669. How much longer did Spinalonga hold out?","until 1715, some 46 years",["it fell the same year","about five years","it never fell"],"Together with Gramvousa and Souda it was among the last Venetian footholds in the eastern Mediterranean. During the war it also sheltered Cretan rebels raiding the mainland."),h("elounda","mythos",2,"Who laid the foundation stone of the fortress in 1579?","Luca Michiel, the Venetian governor of Crete",["Francesco Morosini, later Doge of Venice","Andrea Gritti, Doge at the height of Venice","Arthur Evans, long before he dug at Knossos"],"His name is carved on the main gate. Crete was then the Kingdom of Candia, and Venice fortified it as the hinge of its trade with the Levant."),h("elounda","zahlen",2,"How long did Spinalonga serve as a leper colony?","from 1903 to 1957",["from 1850 to 1900","from 1930 to 1940","from 1920 to 1980"],"One of the last in Europe. It closed once treatment became available \u2014 and the last inhabitant, a priest, stayed on until 1962."),h("elounda","mythos",3,"What did the residents of Spinalonga found in 1936?","a Brotherhood of Patients, to run their own affairs",["a hospital ship to serve the eastern islands","a school for the children on the mainland","a monastery, on land given by the church"],"They organised a caf\u00e9, a barbershop and church services. People sent there to be forgotten built a community instead \u2014 which is why UNESCO calls the place a monument to human pain rather than simply a ruin."),h("heraklion","mythos",1,"What guards the entrance to Heraklion's old harbour?","the fortress of Koules",["a lighthouse only","a chain across the water","nothing survives"],"Two storeys of stone on the western pier, and the most photographed thing in the city after the Lions Fountain."),h("heraklion","mythos",3,"The fortress was built by Venetians but is known by a Turkish name. What does Koules come from?","Su Kulesi, the water tower",["Kule Bey, a governor","kouloura, a ring","koulos, meaning armless"],"The Venetians called it Rocca a Mare or Castello a Mare \u2014 fortress on the sea. The Ottoman name is the one that stuck in everyday Cretan speech."),h("heraklion","zahlen",3,"How thick are the outer walls of Koules?","up to about 8.7 metres",["about 1 metre","about 3 metres","about 20 metres"],"Built for the age of gunpowder, when a wall had to absorb a cannonball rather than merely stop a ladder. The ground floor holds 26 rooms: stores, magazines, cisterns and prisons."),h("heraklion","mythos",2,"What is carved into the outer walls of Koules?","the winged lion of Saint Mark",["the double-headed eagle","the Minoan bull","the Ottoman crescent"],"Three of them, the emblem of Venice. Their heads are gone \u2014 later hands removed what the reliefs stood for and left the rest."),h("heraklion","mythos",3,"The rocky outcrop under Koules was not solid enough. What did the Venetians do?","sank old galleys filled with stone to build it up",["drove wooden piles","imported rock from Italy","moved the fortress inland"],"Ships ending their lives as foundations. The fortress covers 3600 square metres, and much of what it stands on was once a fleet."),h("chalkida","mythos",2,"The castle overlooking Chalkida stands where?","on the Boeotian side, across the strait",["in the middle of the old town","on the island of Euboea","on an islet in the strait"],"Karababa, on the hill of Fourka. It watches the crossing from the mainland shore, which is the side an attacker would come from."),h("chalkida","mythos",3,"Karababa was built by the Ottomans in 1684 against the Venetians. Who designed it?","a Venetian, Gerolimo Galopo",["an Ottoman court architect","a French engineer","nobody knows"],"Which is why the fortress looks more European than Turkish. An Ottoman castle, built to keep Venetians out, drawn up by a Venetian."),h("chalkida","mythos",3,"Who besieged Chalkida in 1688, and how did it end?","Morosini, and he failed",["Morosini, and he took the town after a month","a French expedition, and it took the town","nobody \u2014 the strait made a siege impossible"],"The same Venetian who had blown up the Parthenon the year before. Karababa's guns across the water helped beat him off, plague killed four thousand of his men, and he withdrew in October. He turns up three times in this quiz \u2014 a fountain in Heraklion bears his family name, the Acropolis wears his shell, and here he was simply beaten."),h("chalkida","zahlen",2,"What sits on Karababa's battlements today?","two Russian cannons from the nineteenth century",["a Venetian galley hauled up from the strait","an Ottoman minaret left standing from 1684","a radar station put up during the last war"],"Later arrivals than the fortress itself. Inside there is also a church of the Prophet Elias and a collection of sculpture spanning early Christian to Ottoman work."),h("chalkida","mythos",3,"The hill Karababa stands on may be an ancient site. Which?","Kanithos",["Aulis","Eretria","Lefkandi"],"Traces of buildings and graves lie on the surface. It was probably fortified in Roman times, then left alone through the Byzantine, Venetian and early Ottoman centuries."),h("chalkida","mythos",3,"In the old walled quarter of Chalkida, the Castro, who lived side by side into the twentieth century?","Jewish and Muslim families",["only Venetians","only Orthodox Greeks","nobody, it was purely military"],"The Greek population lived mostly in the newer suburb outside. Much of the Castro came down in the earthquake of 1894 and more was cleared for the road."),h("alle","essen",1,"Gavros \u2014 what is it in English?","anchovy",["sardine","herring","mackerel"],"Engraulis encrasicolus, the European anchovy. Cheap, abundant and everywhere: fried, or cured in vinegar as gavros marinatos, which is the classic thing to put beside an ouzo."),h("alle","essen",1,"Sardela \u2014 what is it in English?","sardine",["anchovy","smelt","whiting"],"Sardina pilchardus. Greek waters have far fewer than they once did; a great deal of what is sold is now imported."),h("alle","essen",2,"Marida \u2014 what is its proper English name?","picarel",["whitebait","sprat","silverside"],"Spicara smaris. Menus very often print whitebait instead, but whitebait is not a species at all \u2014 it means the young of various fish. Marida is a fish in its own right."),h("alle","essen",3,"If your marida tastes bitter, what has probably happened?","you have been given small gopa, which is bogue",["it was frozen and thawed more than once","it was caught far too young to have any flavour","it was salted before frying, which turns it bitter"],"Boops boops. The two look alike at small sizes. Worth knowing that the marida season does not open until October."),h("alle","essen",2,"Atherina \u2014 what is it in English?","sand smelt",["anchovy","young sardine","sea bream"],"Atherina boyeri and its relatives, eight to ten centimetres, floured and fried whole and eaten like crisps. Similar in size to marida but a different family entirely."),h("alle","essen",2,"Lavraki \u2014 what is it in English?","European sea bass",["sea bream","grouper","grey mullet"],"Dicentrarchus labrax. Most of what you are served is farmed; the wild fish, especially from Mesolongi, is another thing altogether and priced accordingly."),h("alle","essen",2,"Tsipoura \u2014 what is it in English?","gilt-head bream",["sea bass","dentex","white bream"],"Sparus aurata, named for the gold band between its eyes. Along with lavraki it makes up the great majority of Greek fish farming."),h("alle","essen",3,"Synagrida \u2014 what is it in English?","common dentex",["sea bass","gilt-head bream","grouper"],"Dentex dentex. A predator, wild-caught, and one of the fish a Greek fish restaurant will charge most for by the kilo."),h("alle","essen",3,"Rofos \u2014 what is it in English?","dusky grouper",["white grouper","wreckfish","sea bass"],"Epinephelus marginatus. Do not confuse it with sfyrida, which is the white grouper, Epinephelus aeneus \u2014 Greek separates them and both appear on menus."),h("alle","essen",2,"Skorpina \u2014 what is it in English?","scorpionfish",["stonefish","monkfish","weever"],"Scorpaena, with venomous spines on the dorsal fin that need respecting when handling it. Ugly, awkward, and the backbone of a good fish soup."),h("alle","essen",3,"Koutsomoura and barbouni belong to which family?","the goatfishes, sold in English as red mullet",["the grey mullets, sold whole off the slab","the breams, along with tsipoura and sargos","the wrasses, the coloured fish of the rocks"],"Mullidae \u2014 nothing to do with grey mullet, which is a different family altogether. They carry two barbels under the chin, and that is what the goat in goatfish refers to. Barbouni itself comes from barba, a beard."),h("alle","essen",3,"Koutsomoura \u2014 which species is it?","Mullus barbatus",["Mullus surmuletus","Spicara smaris","Boops boops"],"Barbouni is the other one, Mullus surmuletus. Greek keeps them firmly apart even though both are goatfish and look alike on the slab."),h("alle","essen",3,"Here is the trap. Which of the two is called plain \u00abred mullet\u00bb in English, by species?","koutsomoura, because Mullus barbatus is the red mullet",["barbouni, because it is the better fish","both equally","neither, they are grey mullets"],"Barbouni is Mullus surmuletus, properly the striped red mullet or surmullet. But since barbouni is the fish worth paying for, menus and cooks attach \u00abred mullet\u00bb to it \u2014 and the cheaper koutsomoura inherits the same words."),h("alle","essen",3,"How do you tell a koutsomoura from a barbouni by looking?","the koutsomoura's snout drops almost vertically",["the koutsomoura is much the larger of the two","the barbouni has no barbels under its chin","only the koutsomoura is properly red in colour"],"That is where the name comes from: koft\u00ed mo\u00fara, a cut-off snout. The barbouni's head slopes. The koutsomoura is also paler, and its \u00abmoustache\u00bb is less pronounced."),h("alle","essen",3,"Barbouni and koutsomoura are also known by names describing where they live. Which pair?","petrobarbouno on rock, laspobarbouno on mud",["deep barbouni and shallow barbouni","summer barbouni and winter barbouni","north barbouni and south barbouni"],"Rock barbouni and mud barbouni. The koutsomoura works sandy and muddy bottoms down to 300 metres; the barbouni prefers rock, and comes out redder and better flavoured for it \u2014 which is what you are paying for."),h("alle","essen",2,"Why is small fish in Greece usually eaten whole, head and all?","it is floured and fried, and at that size the bones are no trouble",["the heads are considered a delicacy on their own","filleting is forbidden","it is a religious custom"],"Gavros, marida and atherina all get the same treatment. A squeeze of lemon, and nothing left on the plate."),h("alle","essen",3,"Which of these is the odd one out on a Greek fish menu?","kalamari, which is not a fish at all",["gavros, which is fried and eaten whole","marida, which is best in the winter months","atherina, which is floured before frying"],"It is a cephalopod, like the octopus and the cuttlefish. The other three are small silvery fish that arrive at the table fried."),h("alle","meer",1,"Why is the sea in Greece so intensely blue?","The water is very clear and swallows the red light",["The sky above it colours the water blue","A blue alga blooms there every summer","The seabed is white and reflects the sky"],"Water absorbs red light within a few metres; blue travels much further. That is also why everything underwater looks blue-tinted."),h("alle","meer",2,"What is the summer wind that can blow for weeks in the Aegean?","the Meltemi",["the Sirocco","the Mistral","the Trade wind"],"It blows mainly in July and August from the north. Sailors love it and ferry captains dread it \u2014 in a strong Meltemi the boats stay in port."),h("alle","essen",1,"What is tzatziki?","yoghurt with cucumber and garlic",["a grilled fish","a dessert","a wine"],"Greek yoghurt is strained so the whey runs off. That is why it is so thick \u2014 four litres of milk make one litre of yoghurt."),h("alle","essen",2,"What is retsina and what makes it unusual?","a wine flavoured with pine resin",["a wine made from raisins","a wine without alcohol","a wine from Crete"],"Amphorae used to be sealed with pine resin and the taste seeped in. Eventually people liked it \u2014 today the resin is added on purpose."),h("alle","zahlen",2,"Roughly how many inhabited islands does Greece have?","about 200",["about 20","about 2000","about 20 000"],"Depending how you count, there are several thousand islands. Only a small share are inhabited \u2014 some have fewer than ten residents."),h("alle","meer",3,"How do dolphins find their way in murky water?","by echo: they listen to their own sound coming back",["by smell","using the earth's magnetic field","they just follow the coast"],"They send out clicks and read shape, size and distance from the echo. That lets them find a fish buried in sand they cannot see at all."),h("alle","meer",2,"Why is it worth knowing about sea urchins on Greek coasts?","It is easy to step on their spines",["They are poisonous to eat","They attack swimmers","They damage boats"],"Swimming shoes solve it. Greeks eat the orange insides raw with lemon \u2014 they taste like concentrated sea."),h("alle","mythos",2,"What do Greeks call their own country?","Hellas",["Grekia","Athenia","Ionia"],"\u00abGreeks\u00bb is what the Romans called them. They have called themselves Hellenes for three thousand years \u2014 and every car still carries GR for one and \u0395\u039b for the other."),h("alle","zahlen",3,"Why do Greek menus often price fish per kilo?","Fish is weighed fresh and paid for by weight",["Because fish is always expensive","Because it is frozen in portions","Because of a tax rule"],"You are allowed to pick yours in the kitchen. Ask which came in today and you will almost always get an honest answer."),h("alle","essen",3,"Which olive variety makes u
