:{name:"Numbers & Records",zeichen:"\u2605"}};var c0=e=>e[Math.floor(Math.random()*e.length)],Fd=e=>{let t=[...e];for(let a=t.length-1;a>0;a--){let l=Math.floor(Math.random()*(a+1));[t[a],t[l]]=[t[l],t[a]]}return t};function h(e,t,a,l,n,i,u){return{ort:e,kat:t,stufe:a,frage:l,richtig:n,falsch:i,uebrigens:u}}var pl=[h("london","sammlung",1,"What is the most visited object in the British Museum?","the Rosetta Stone",["the Sutton Hoo helmet","the Portland Vase","the Lewis Chessmen"],"It has been on display almost continuously since 1802, and for most of that time behind glass because so many hands wanted to touch it."),h("london","sammlung",1,"How many scripts are carved on the Rosetta Stone?","three",["one","two","seven"],"Hieroglyphs at the top, Demotic in the middle, Greek at the bottom. The same decree three times over, which is exactly what made it useful."),h("london","kron",2,"Why could scholars read the Greek on the Rosetta Stone but not the hieroglyphs?","Greek had never stopped being read",["the Greek was carved much larger","the hieroglyphs were damaged beyond repair","the Greek was a modern addition"],"Knowledge of hieroglyphs died out in late antiquity. Greek ran unbroken from Homer to the present, so the bottom third of the stone was a key nobody had lost."),h("london","kron",2,"Who finally worked out how to read hieroglyphs, in 1822?","Jean-Francois Champollion",["Napoleon Bonaparte","Sir Hans Sloane","Howard Carter"],"Thomas Young got a good way there first and the two are often argued over. Champollion had an advantage: he read Coptic, the last descendant of the Egyptian language."),h("london","zahlen",2,"When was the Rosetta Stone found, and by whom?","1799, by French soldiers in Egypt",["1822, by an English scholar","1650, by Ottoman builders","1901, by a British expedition"],"It turned up in a wall at Rosetta, near the mouth of the Nile. Two years later the French surrendered in Egypt and it went to London under the treaty terms."),h("london","zahlen",2,"When did the British Museum open its doors?","1759",["1601","1851","1901"],"Which makes it the oldest national public museum in the world. It has been free to enter from the very first day."),h("london","kron",2,"Whose collection started the British Museum?","Sir Hans Sloane's",["King George III's","Christopher Wren's","Charles Darwin's"],"A physician who left about 71,000 objects to the nation on the condition they stayed together and stayed free. Parliament paid his heirs with money raised by a lottery."),h("london","zahlen",3,"Roughly what share of the British Museum's collection is on display?","about one per cent",["about half","about a quarter","nearly all of it"],"Around eight million objects exist; some eighty thousand are out at any time. The rest is study collection, and most of it has been seen by more researchers than tourists."),h("london","sammlung",2,"What covers the Great Court at the centre of the museum?","a glass and steel roof",["a painted dome","open sky","a canvas awning"],"Opened in 2000 and the largest covered square in Europe. The roof has over three thousand panes of glass and no two are the same shape."),h("london","sammlung",2,"What stands in the middle of the Great Court?","the old circular Reading Room",["a marble obelisk brought from Egypt","a fountain with a bronze Neptune","a bandstand used for summer concerts"],"Marx, Dickens, Woolf and Gandhi all read there. It was walled in by book stacks for a century until the British Library moved out and the courtyard was opened up."),h("london","sammlung",2,"Which helmet, buried in a ship, is one of the museum's treasures?","the Sutton Hoo helmet",["the helmet of Agamemnon","a Roman legionary helmet","a Viking horned helmet"],"Found in Suffolk in 1939, weeks before war broke out. It was in hundreds of fragments and has been reconstructed twice, the second time quite differently from the first."),h("london","sammlung",3,"The Lewis Chessmen are split between two museums. Which?","the British Museum and the National Museum of Scotland",["the British Museum and the Louvre in Paris","two rival museums in Bergen and Oslo","the British Museum and Edinburgh Castle"],"Eighty-two are in London, eleven in Edinburgh. So the family saw part of the same hoard in both cities, walrus ivory carved in Norway around 1200 and buried on Lewis."),h("london","sammlung",3,"What do several of the Lewis Chessmen appear to be doing?","biting their shields",["holding hands","sleeping","riding horses"],"The berserkers chew their shield rims, which is what Norse sagas say berserkers did before a fight. The queens rest a hand against the cheek, looking thoroughly fed up."),h("london","sammlung",2,"Which Assyrian animals are carved on the huge reliefs from Nineveh?","lions being hunted",["elephants at war","horses racing","bulls being sacrificed"],"Cut around 645 BC for the palace of Ashurbanipal. The dying lioness dragging her hind legs is often called the finest animal carving to survive from the ancient world."),h("london","sammlung",3,"Where did the museum's famous stone figure Hoa Hakananai'a come from?","Easter Island",["Egypt","Mexico","Nigeria"],"Taken by a Royal Navy ship in 1868. Rapa Nui representatives have asked for it back, and the name is usually translated as something like the lost or stolen friend."),h("london","kron",3,"The Parthenon sculptures in the museum are argued over. What is the core of the dispute?","whether Lord Elgin had the right to remove them",["whether they were carved by Phidias himself","whether the marbles are genuine or later copies","whether they were painted in antiquity"],"He had a document from the Ottoman authorities then ruling Greece; what it actually permitted is contested, and the original is lost. Greece has asked for their return since 1832."),h("london","zahlen",3,"How much did Parliament pay Lord Elgin for the sculptures in 1816?","35,000 pounds, about half what they cost him",["nothing at all, he presented them as a gift","rather more than a million pounds in today's money","he was fined for damaging them in transit"],"A committee investigated first and he lost money on the whole affair. That parliamentary debate is why the sculptures belong to the nation rather than to a family."),h("london","sammlung",2,"Which board game, over 4500 years old, is in the museum's Mesopotamian rooms?","the Royal Game of Ur",["chess, in a recognisably modern form","backgammon, played with carved dice","draughts, on a board of glazed tiles"],"A museum curator worked out the rules from a much later cuneiform tablet, so a game nobody had played for millennia can be played again."),h("london","natur",1,"What skeleton hangs in the great hall of the Natural History Museum?","a blue whale",["a diplodocus","a mammoth","a giant squid"],"She is called Hope. A diplodocus cast named Dippy stood there for decades and was moved out in 2017, which caused a national argument in the newspapers."),h("london","natur",2,"Where did the museum's blue whale come from?","it stranded on the Irish coast in 1891",["it was hunted expressly for the museum","it was a diplomatic gift from Norway","the whole thing is a plaster model"],"It beached at Wexford after being injured. The bones sat in storage for decades before anyone put them on show, and Hope now hangs as if lunging for food."),h("london","natur",1,"How big can a blue whale's heart be?","about the size of a small car",["about the size of a fist","about the size of a football","about the size of a house"],"The largest animal that has ever lived, larger than any dinosaur, and it eats some of the smallest: krill, a few centimetres long, by the tonne."),h("london","kron",2,"Who was the driving force behind founding the Natural History Museum?","Richard Owen",["Charles Darwin","Alfred Waterhouse","Joseph Banks"],"He also invented the word dinosaur, in 1842, from Greek for terrible lizard. He was a fierce opponent of Darwin, and the two men's statues have swapped places in the hall over the years."),h("london","zahlen",2,"When did the Natural History Museum building open?","1881",["1750","1925","1968"],"Alfred Waterhouse designed it in terracotta, partly because the material could be washed clean of Victorian London's soot."),h("london","natur",3,"The animals moulded into the museum's walls follow one rule. What is it?","living species in one wing, extinct ones in the other",["they are arranged in alphabetical order","only species found in Britain appear","every one of them is a mammal"],"East wing for the living, west wing for the extinct. Waterhouse and Owen worked it out together, so the building itself is arranged as a classification."),h("london","natur",2,"Which fossil bird, the famous link to dinosaurs, is in the museum?","Archaeopteryx",["the dodo","the great auk","a penguin"],"The London specimen, bought in 1862 from a German doctor who took it as payment from a quarryman. Feathers pressed into limestone, and Darwin's Origin only three years old."),h("london","natur",2,"What is Sophie, one of the museum's stars?","the most complete Stegosaurus ever found",["a live tarantula kept in the insect gallery","a meteorite that fell on Yorkshire","a giant sequoia trunk sliced across"],"Over eighty per cent complete, which is remarkable for a dinosaur. Nobody knows whether Sophie was female; the name came from a donor's daughter."),h("london","natur",3,"What are the plates along a Stegosaurus's back now generally thought to be for?","display, and possibly temperature",["swimming, as paddles in deep water","digging out burrows for its young","catching and holding onto food"],"They are thin, full of blood vessels, and not well placed for defence. The spikes on the tail are the actual weapon, and they have a name from a cartoon: the thagomizer."),h("london","natur",2,"What can you experience in the museum's earthquake room?","the shaking of the 1995 Kobe earthquake",["a volcano erupting under a glass floor","a tornado you can stand inside","a tsunami crossing a model harbour"],"A Japanese grocery shop floor that moves under your feet, rebuilt from footage of the real thing. It is the exhibit children remember longest, usually."),h("london","natur",3,"What is unusual about the museum's collection of specimens from Darwin's Beagle voyage?","some were collected by Darwin himself",["they were all painted, never preserved","they were lost at sea","they are all fakes"],"The museum holds Darwin's own specimens, and also his pigeons: he bred them to study how quickly a domestic animal's form can be pushed around."),h("london","zahlen",3,"Roughly how many specimens does the Natural History Museum hold?","about 80 million",["about 80 thousand","about 800 thousand","about 8 billion"],"Most will never be displayed. They exist so that a scientist in eighty years can check what a species looked like before something changed."),h("london","zahlen",2,"Which great event's leftovers founded the Science Museum?","the Great Exhibition of 1851",["the Coronation of Victoria","the Festival of Britain","the first World Cup"],"The exhibition made a profit, and the money bought the land in South Kensington that now holds three museums and the Royal Albert Hall."),h("london","sammlung",2,"Which famous early locomotive is in the Science Museum?","Stephenson's Rocket",["the Flying Scotsman","the Mallard","the Orient Express"],"It won the Rainhill Trials in 1829 and settled the argument about whether railways should use locomotives at all. What survives is worn and much altered, not the gleaming thing in the paintings."),h("london","sammlung",3,"Puffing Billy, in the Science Museum, holds which record?","the oldest surviving steam locomotive",["the fastest steam engine ever built","the heaviest locomotive ever built","the last steam engine in British service"],"Built around 1814 to haul coal, and working for nearly fifty years. It is older than the passenger railway itself."),h("london","natur",2,"Which spacecraft part, flown round the Moon, is on display?","the Apollo 10 command module",["a piece of the Space Shuttle","Sputnik","the Mars Rover"],"Charlie Brown, which went to the Moon in May 1969 and came back without landing. It was the dress rehearsal two months before Apollo 11."),h("london","natur",2,"Whose unfinished calculating machines are in the museum?","Charles Babbage's",["Alan Turing's","Isaac Newton's","James Watt's"],"The museum later built his Difference Engine No. 2 from his own drawings, and it worked. Half of Babbage's brain is also in the building, in a jar."),h("london","natur",2,"Which model of a molecule, built in 1953, is in the collection?","the DNA double helix",["a molecule of ordinary water","the structure of penicillin","the carbon lattice of a diamond"],"Watson and Crick's original, assembled from metal plates in a Cambridge workshop. Rosalind Franklin's X-ray images were the evidence that made it possible."),h("london","natur",3,"Which engine, first run in 1937, changed flight forever?","Frank Whittle's jet engine",["the Wright brothers' engine","the Rolls-Royce Merlin","a rotary engine"],"He patented the idea as a young RAF officer in 1930 and was told there was no interest. The museum has the early test engine that proved otherwise."),h("london","natur",1,"What is the Science Museum's hands-on gallery called?","Wonderlab",["the Playroom","the Workshop","the Laboratory"],"Slides that demonstrate friction, a lightning show, and a floor that rewards running. It is the one gallery where being told to be quiet does not apply."),h("london","zahlen",1,"When did Tower Bridge open?","1894",["1750","1837","1952"],"It took eight years, 432 workers and two enormous piers sunk into the riverbed. People often assume it is medieval, which is exactly what the designers wanted."),h("london","kron",2,"Why is Tower Bridge dressed in stone rather than left as bare steel?","to suit the Tower of London beside it",["stone is stronger than steel","steel was unavailable","to keep the weight down"],"Underneath it is a steel frame; the Cornish granite and Portland stone are a coat. Some Victorian critics called the whole thing a pretentious sham, and said so in print."),h("london","natur",2,"How does Tower Bridge open?","the two halves of the road tilt upward",["the whole span lifts straight up","it swings sideways","it splits and rolls back"],"Bascule, from the French for see-saw: each leaf is counterweighted so a huge span can be swung with surprisingly little power."),h("london","natur",3,"What originally powered the lifting of Tower Bridge?","steam engines pumping water under pressure",["a team of horses working a capstan","mains electricity, right from the start","the current of the Thames itself"],"Coal-fired boilers drove pumps, and the pressure was stored in accumulators until needed. The system ran until 1976, when it went over to oil and electricity."),h("london","zahlen",2,"How high above the Thames is the glass floor in the walkway?","about 42 metres",["about 4 metres","about 15 metres","about 150 metres"],"Eleven metres of glass laid along the west walkway, opened in 2014. Each panel is thick enough to hold well over a tonne, which is not the first thing you think about standing on it."),h("london","zahlen",3,"Why were the high walkways of Tower Bridge closed in 1910?","hardly anyone used them",["they were unsafe","a fire damaged them","the war began"],"Pedestrians preferred to wait at street level and watch the bridge open. The walkways reopened in 1982 as a viewpoint, and the glass came thirty years after that."),h("london","kron",3,"In 1952 a London bus was on Tower Bridge as it began to open. What happened?","the driver accelerated and jumped the gap",["the bridge was stopped just in time","the bus went through into the river","the bus reversed off at the last moment"],"Albert Gunter jumped about a metre onto the far bascule. Passengers were shaken, the conductor broke a leg, and the driver was given a ten pound bonus."),h("london","kron",2,"Tower Bridge is often confused with which other bridge?","London Bridge",["Westminster Bridge","the Millennium Bridge","Waterloo Bridge"],"London Bridge is the plain one upstream. In 1968 the old London Bridge was sold to an American businessman and rebuilt in Arizona, where it still stands."),h("london","zahlen",2,"How often does Tower Bridge still open?","around 800 times a year",["never any more","about twice a year","every hour"],"Shipping still has priority over road traffic, so a tall boat stops the traffic. It is free, but you must give twenty-four hours notice."),h("london","kron",3,"Tower Bridge was painted red, white and blue in 1977. What colour had it been?","chocolate brown",["black","green","bright red"],"The repaint was for the Queen's Silver Jubilee and it stuck. Underneath, layers of Victorian paint survive as a record of every fashion since."),h("london","zahlen",1,"What runs through Greenwich and divides east from west?","the Prime Meridian",["the Equator","the Tropic of Cancer","the Arctic Circle"],"Zero degrees longitude. Unlike the Equator, which the spinning Earth fixes for you, this line is a decision people had to agree on."),h("london","kron",2,"When was Greenwich agreed as the world's prime meridian?","1884, at a conference in Washington",["1675, by royal decree","1066, after the conquest","1945, by the United Nations"],"Twenty-five nations voted. Britain had most of the world's shipping already using Greenwich charts, which made the argument largely practical."),h("london","kron",3,"Which country abstained from the 1884 vote on the meridian?","France",["Germany","Russia","the United States"],"France kept measuring from Paris and did not formally adopt Greenwich until 1911, and even then described it in law as Paris mean time minus nine minutes twenty-one seconds."),h("london","natur",3,"What actually defines the meridian line at Greenwich?","a telescope, the Airy Transit Circle",["a brass strip in the ground","the observatory's front door","a laser"],"Set up by Astronomer Royal George Airy in 1851. The line is wherever that instrument pointed, which is why the brass strip is where it is and not a metre either way."),h("london","natur",3,"Stand on the brass line with a phone and the satellites disagree. By how much?","about 100 metres",["about 10 kilometres","about 2 millimetres","they agree exactly"],"Satellite systems use a meridian based on the Earth's centre of mass; Airy's telescope was levelled against local gravity, which the mass of nearby hills tugs slightly sideways. Both are right."),h("london","zahlen",2,"Who founded the Royal Observatory at Greenwich, and when?","Charles II, in 1675",["Queen Victoria, in 1850","Henry VIII, in 1530","Isaac Newton, in 1700"],"The purpose was navigation: fixing the stars accurately enough for sailors to find their position at sea. Christopher Wren, an astronomer before he was an architect, designed the first building."),h("london","natur",2,"What drops from a mast at the observatory every day at one o'clock?","a red time ball",["a flag","a bell","a cannonball into a net"],"Working since 1833 so ships on the Thames could set their chronometers. It is one of the world's oldest public time signals still running."),h("london","natur",3,"Why was finding longitude at sea so much harder than finding latitude?","longitude needs an accurate clock",["longitude needs a telescope","latitude cannot be found at all","longitude changes with the seasons"],"The Sun gives latitude directly. For longitude you must know the time back home while you read the local Sun, and no clock could keep time on a rolling, damp, changeable ship."),h("london","kron",3,"Who solved the longitude problem, and how?","John Harrison, with sea clocks",["Newton, with mathematics","Cook, by sailing further","Flamsteed, with star charts"],"A Lincolnshire carpenter with no formal training. His H4 lost only a few seconds on a voyage to Jamaica, and the board that had promised the prize spent years finding reasons not to pay it."),h("london","sammlung",2,"What kind of ship is the Cutty Sark?","a tea clipper",["a warship","a submarine","a paddle steamer"],"Built for speed on the China tea run, where the first cargo home fetched the best price. Steam and the Suez Canal ended that trade almost as soon as she was launched."),h("london","zahlen",2,"Where was the Cutty Sark built, in 1869?","Dumbarton, in Scotland",["Greenwich, where she now sits","Portsmouth, in the naval dockyard","Belfast, on the Lagan"],"On the Clyde. So the most famous ship in London was Scottish-built, which makes her a fair link between the two halves of this trip."),h("london","kron",3,"Where does the name Cutty Sark come from?","a poem by Robert Burns",["her first captain","a Chinese port","a kind of sail"],"From Tam o' Shanter. A cutty sark is a short shift, worn by the witch Nannie who chases Tam and catches his horse by the tail."),h("london","kron",3,"What is the Cutty Sark's figurehead holding?","a horse's tail",["a lantern","a sword","a teacup"],"Nannie the witch, grasping the tail she tore from Tam's mare. A ship named after a witch was thought unlucky by some of her crews."),h("london","natur",3,"After the tea trade ended, what was the Cutty Sark best at?","carrying wool from Australia",["carrying passengers","fishing","laying cable"],"She made the Australia run faster than anyone, once beating a steamer over the same route. Her best day's run was over 360 nautical miles."),h("london","zahlen",3,"Why can you now walk underneath the Cutty Sark?","she was raised three metres in her dry dock",["the dock beneath her was dug deeper","she floats above a glass water tank","the whole lower hull is a replica"],"The 2012 restoration lifted her so the hull could be seen from below, which is the shape that made her fast. A serious fire in 2007 nearly ended the whole project."),h("london","zahlen",1,"When did the London Eye open?","in 2000, for the millennium",["in 1951, for the Festival of Britain","in 1977, for the Silver Jubilee","in 2012, for the Olympics"],"It was meant to stand for five years and then come down. Twenty-six years later it is one of the most visited paid attractions in the country."),h("london","zahlen",1,"How long does one turn of the London Eye take?","about half an hour",["about five minutes","about two hours","about ten minutes"],"Slow enough that the whole city rearranges itself around you, and slow enough that nobody feels sick."),h("london","natur",2,"Why does the London Eye not stop to let people on?","it turns slowly enough to step aboard",["it does stop, every time","passengers jump between capsules","it stops only for children"],"It creeps round at about a quarter of a metre a second, slower than a stroll. It halts only for visitors who need more time getting in."),h("london","zahlen",2,"How many capsules does the London Eye carry?","32, one for each London borough",["12, one for each month","64, in two rings","100, in a continuous chain"],"Each holds about twenty-five people. They sit outside the rim rather than hanging from it, which is why the view is not cut in half by the wheel."),h("london","zahlen",3,"Which capsule number is missing from the London Eye?","13",["7","21","30"],"The capsules run from 1 to 33 with no 13, so there are still 32 of them. Superstition survives surprisingly well in engineering."),h("london","zahlen",2,"How far can you see from the top of the London Eye on a clear day?","about 40 kilometres",["about 4 kilometres","about 200 kilometres","about 400 kilometres"],"Far enough to pick out Windsor Castle to the west. The wheel is 135 metres high, which is modest by modern standards and quite enough for a flat city."),h("london","kron",3,"How was the London Eye put up?","assembled lying flat on the river, then raised",["built upward from the hub","flown in by helicopter","floated in complete from Holland"],"It was lifted from horizontal to vertical over a week, in stages. The first attempt was abandoned when a cable failed, which was watched by a large and disappointed crowd."),h("london","kron",1,"Which building stands directly across the river from the London Eye?","the Houses of Parliament",["Buckingham Palace","the Tower of London","St Paul's Cathedral"],"The Palace of Westminster, with Elizabeth Tower at the near end. The wheel was placed to look straight at it, which not everyone was pleased about at the time."),h("london","kron",2,"Big Ben is the name of what, exactly?","the great bell inside the tower",["the tower itself","the clock face","the whole palace"],"The tower was called the Clock Tower until 2012, when it was renamed Elizabeth Tower for the Diamond Jubilee. Almost nobody uses either name correctly, including Londoners."),h("london","kron",2,"Which domed cathedral can you see downstream from the Eye?","St Paul's",["Westminster Abbey","Canterbury Cathedral","York Minster"],"Christopher Wren's, finished in 1710 after the Great Fire took the old one. For 250 years it was the tallest building in London, and sightlines to it are still protected by law."),h("london","zahlen",2,"Which is the tallest building visible from the London Eye?","the Shard",["the Gherkin","the BT Tower","Tower Bridge"],"310 metres, and the tallest in the United Kingdom. Renzo Piano is said to have sketched it on a menu, as a shard of glass rising out of the Thames."),h("london","kron",3,"What are the four white chimneys downstream on the south bank?","Battersea Power Station",["a Victorian pumping works","a disused gasworks","a modern incinerator"],"It burned coal until 1983 and then stood as a roofless shell for thirty years. It reopened in 2022 full of shops and flats, and a Pink Floyd sleeve once had a pig flying over it."),h("london","kron",2,"Which church next to Parliament has held every coronation since 1066?","Westminster Abbey",["St Paul's Cathedral","Southwark Cathedral","St Margaret's"],"Forty of them. It is also where the Stone of Destiny travels to and from, which links it neatly to Edinburgh Castle."),h("london","sammlung",2,"Which grand old building holds the Sea Life aquarium?","County Hall",["the Old Bailey","Somerset House","the Royal Festival Hall"],"Built for the London County Council and later home to the Greater London Council, which was abolished in 1986. The tanks sit where the city's government used to argue."),h("london","natur",2,"Where did the aquarium's gentoo penguins come from?","Edinburgh Zoo",["Antarctica, directly","a zoo in Norway","they were bred on site"],"Ten of them travelled down in 2011, and the colony has grown since. So the family saw Edinburgh penguins in London and Edinburgh chessmen in the British Museum."),h("london","natur",2,"What do you walk on at the aquarium's Shark Walk?","a glass floor above the sharks",["a rope bridge","a moving walkway","sand from a real beach"],"The second glass floor of the trip, after Tower Bridge. This one has something moving underneath it, which makes it the harder of the two."),h("london","natur",2,"What swims over your head in the aquarium's Ocean Tunnel?","green sea turtles and rays",["dolphins and seals","penguins and puffins","octopus and squid"],"A curved acrylic tunnel with the tank wrapped around it. Rays glide over the top with their pale undersides showing, looking like they are smiling."),h("london","natur",3,"The aquarium's Thames Walk shows what?","the fish that live in the river outside",["a model of the Thames Barrier","the history of London's docks","fossils dug from the riverbed"],"Perch, rudd and grayling, a few metres from where they actually swim. The Thames was declared biologically dead in 1957 and now holds well over a hundred species."),h("london","natur",3,"Sharks kill about twenty people a year worldwide. What kills roughly five times more?","wasps",["dogs","lightning","falling coconuts"],"The aquarium likes pointing this out while you stand on the glass above them. People kill something in the order of a hundred million sharks a year in return."),h("london","zahlen",1,"Where is the world's largest Lego store?","Leicester Square",["Oxford Street","Covent Garden","Piccadilly Circus"],"Two floors and over nine hundred square metres, opened in 2016. Everything big in it is themed on London."),h("london","zahlen",2,"What life-size vehicle is built from Lego in the Leicester Square store?","an Underground carriage",["a red double-decker bus","a black taxi","a royal carriage"],"Made from 637,903 bricks and 4,000 hours of work, with Transport for London's blessing. You can sit inside it, between a Grenadier Guard and William Shakespeare."),h("london","zahlen",2,"How tall is the Lego model of Big Ben in the store?","about six and a half metres",["about one metre","about twenty metres","about half a metre"],"Roughly 200,000 bricks, and the clock face actually works and lights up. When the real bell fell silent for restoration, the newspapers pointed out that this one still chimed."),h("london","natur",2,"What does the store's Mosaic Maker booth do?","turns your photo into a brick portrait",["builds a model while you watch","scans models you have built","prints Lego instructions"],"It photographs you, works out the palette, and hands over the baseplate with the bricks and instructions to build your own face."),h("london","zahlen",3,"How much do the Lego sculptures in the store weigh altogether?","about five tonnes",["about fifty kilos","about five hundred kilos","about fifty tonnes"],"Around 1.7 million bricks in total. The Underground carriage alone accounts for more than a third of them."),h("london","kron",1,"What is Trafalgar Square named after?","a sea battle",["a duke","a river","a market"],"Trafalgar, off the Spanish coast, in 1805. Nelson beat the combined French and Spanish fleets there and was shot dead during the fighting."),h("london","kron",2,"Who stands on top of the column in Trafalgar Square?","Admiral Nelson",["the Duke of Wellington","Queen Victoria","Winston Churchill"],"The column is about 52 metres to the top of his hat. He is turned to face south-west, roughly towards Portsmouth and the sea."),h("london","zahlen",2,"How many bronze lions guard the base of Nelson's Column?","four",["two","six","eight"],"Added in 1867, twenty-five years after the column itself. They are said to have been cast using metal from French guns."),h("london","natur",3,"Why do the paws of the Trafalgar Square lions look slightly wrong?","the sculptor worked from a decaying lion",["they were carved from photographs","they are copies of Egyptian lions","the moulds were damaged"],"Edwin Landseer was a painter, not a sculptor. London Zoo sent him a dead lion to model from, it decayed faster than he worked, and the paws ended up more like a house cat's."),h("london","kron",3,"One plinth in Trafalgar Square stood empty for over 150 years. What is on it now?","a new artwork every year or two",["a statue of Queen Victoria","nothing, it is still empty","a war memorial"],"The Fourth Plinth ran out of money in 1841 and stayed bare until 1998. It now holds rotating contemporary commissions, which reliably start an argument."),h("london","kron",3,"Where are distances to London officially measured from?","a statue at the top of Whitehall",["the middle of Trafalgar Square","St Paul's Cathedral","Marble Arch"],"The equestrian statue of Charles I, on the site of the old Charing Cross. Every road sign saying how far it is to London means how far to that spot."),h("london","kron",2,"Why is Piccadilly Circus called a circus?","the Latin word means a circle",["a circus once performed there","it is named after a family","clowns lived nearby"],"It describes a round open space where streets meet. Oxford Circus is the same idea, and so is the Circus at Bath."),h("london","kron",3,"The statue at Piccadilly Circus is called Eros. Who is it really?","his brother Anteros",["Eros himself","Apollo","Hermes"],"It crowns a memorial to Lord Shaftesbury, the social reformer, so the sculptor chose the god of selfless rather than romantic love. Nobody has ever called it that."),h("london","natur",3,"What was unusual about the Piccadilly Circus statue when it was unveiled in 1893?","it was cast in aluminium",["it was made of glass","it was hollow and floated","it was carved from a single stone"],"One of the first statues anywhere cast in the metal, which was then a novelty and expensive. It is why the figure is so light on one toe."),h("london","kron",2,"What is Leicester Square best known for?","film premieres",["fruit and vegetable markets","government offices","university buildings"],"The cinemas ring the square and the red carpet goes down across it. A statue of Shakespeare stands in the middle, looking unimpressed."),h("london","kron",1,"Which Disney musical did the family see in the West End?","Hercules",["The Lion King","Aladdin","Frozen"],"At the Theatre Royal Drury Lane, where it opened in June 2025. It is based on the 1997 animated film."),h("london","kron",2,"In the show, who tells the story and comments on the action?","the Muses",["a narrator in a toga","Zeus himself","the audience"],"Five of them, singing in gospel style. In Greek myth the Muses are the goddesses who inspire poetry and music, so putting the story in their mouths is not a bad joke."),h("london","kron",2,"Which song from Hercules is the best known?","Go the Distance",["Let It Go","Circle of Life","A Whole New World"],"It was nominated for an Oscar. Alan Menken wrote the music and David Zippel the lyrics, and new songs were added for the stage version."),h("london","kron",3,"Hercules is the Roman name. What did the Greeks call him?","Heracles",["Perseus","Theseus","Achilles"],"Meaning glory of Hera, which is an odd name for a hero Hera spent his whole life trying to destroy. He was Zeus's son by a mortal woman."),h("london","kron",3,"In Greek myth, how many labours was Hercules set?","twelve",["three","seven","forty"],"The lion, the hydra, the boar, the stables and the rest. Disney makes Hades the villain, which the Greeks did not: Hades ruled the dead and was rarely the enemy."),h("london","zahlen",3,"What is notable about the site of the Theatre Royal Drury Lane?","a theatre has stood there since 1663",["it was once a prison","it was built for Shakespeare","it is the smallest in the West End"],"The oldest theatre site in continuous use in the world. The present building is the fourth, opened in 1812, the earlier three having burned down or been pulled down."),h("london","sammlung",1,"Which Japanese warriors are represented in the British Museum's Japan galleries?","samurai",["ninja only","sumo wrestlers","shogun emperors"],"Armour, helmets and swords among ceramics, prints and manga. The museum holds one of the most complete Japanese collections outside Japan."),h("london","kron",2,"What does the word samurai originally mean?","one who serves",["one who fights","one who rules","one who rides"],"From a verb meaning to attend on somebody. They began as retainers and only later became the ruling warrior class."),h("london","kron",3,"Much samurai armour in museums was never meant for battle. Why not?","Japan was largely at peace under the Edo shoguns",["it was too heavy to move in","it was made only for children","it was always made for export"],"From 1615 to 1868 there was very little fighting, so armour became ceremonial: lacquer, silk braid and gilt, made to be seen. Edo is the city now called Tokyo."),h("london","sammlung",3,"What does the wavy line running along a samurai sword blade show?","where the steel was hardened",["the maker's signature","how many battles it fought","the owner's rank"],"The hamon. The edge is quenched fast and the spine slowly, so the blade is hard enough to hold an edge and soft enough not to snap."),h("london","natur",3,"The Japan galleries begin with Jomon pots. What record do they hold?","among the oldest pottery in the world",["the largest pots ever fired","the first use of a potter's wheel","the oldest glazed ceramics"],"Made in Japan something like 17,000 years ago. Jomon means cord-marked, after the rope pressed into the wet clay to decorate it."),h("london","kron",3,"What is a kabuto?","a samurai helmet",["a short sword","a war banner","a horse's saddle"],"Often topped with an enormous crest, in antlers, moons, shells or leaves. The point was to be recognised across a battlefield, and to be frightening while you were."),h("london","kron",2,"Where was the modern circus invented?","London, in 1768",["Paris, in 1830","Rome, in ancient times","New York, in 1870"],"Philip Astley, a former cavalry sergeant-major, roped off a ring near Westminster Bridge and performed trick riding in it. That patch of Lambeth is a few minutes from where the London Eye now turns."),h("london","natur",3,"Why is a circus ring about thirteen metres across, everywhere in the world?","it is the best size for standing on a cantering horse",["it was the size of Astley's garden","tent poles come in that length","it matches a Roman arena"],"Astley found that at roughly 42 feet the horse leans inward at just the angle that helps a rider keep their feet. Every big top since has copied a measurement taken from a horse."),h("london","kron",3,"Astley never used the word circus. Who did?","a rival who opened the Royal Circus",["the newspapers of the day","the King","his own performers"],"Charles Hughes, in 1782, borrowing a Roman word for a ring. Astley called his the Amphitheatre and seems to have been irritated for the rest of his life."),h("london","kron",3,"Joseph Grimaldi, the great London clown, gave clowns which nickname?","Joey",["Bozo","Coco","Auguste"],"He performed at Sadler's Wells and more or less invented the white-faced clown. A service is still held in his memory each year with the congregation in full costume."),h("london","kron",3,"The leotard is named after a real person. Who was he?","a French trapeze artist",["a London tailor","a circus owner","a ballet composer"],"Jules Leotard, who performed the first flying trapeze act in 1859 and designed the garment to move in. The song about the daring young man is about him."),h("edinburgh","natur",1,"What does a camera obscura do?","throws a live picture of the city onto a table",["shows film recorded earlier that day","takes photographs of the visitors","magnifies the stars after dark"],"A lens and a mirror on the roof, a darkened room below, and Edinburgh moving on a white dish. No electricity anywhere in the process."),h("edinburgh","natur",2,"What do the words camera obscura mean?","dark chamber",["hidden eye","city mirror","seeing glass"],"Latin. The name is a description of the method: you need the room dark so that the faint image coming through the lens can be seen at all."),h("edinburgh","zahlen",2,"How old is Edinburgh's Camera Obscura?","it opened in 1835",["it opened in 1935","it opened in 1750","it opened in 1999"],"Which makes it the oldest purpose-built attraction in the city. The camera has been showing the same streets to visitors for nearly two centuries."),h("edinburgh","kron",3,"Who founded the observatory that became the Camera Obscura?","Maria Theresa Short",["Patrick Geddes","Walter Scott","Robert Louis Stevenson"],"She brought her father's telescope back from the West Indies and fought the city authorities for years over the right to show it. The building was later taken over and renamed."),h("edinburgh","kron",3,"Patrick Geddes bought the tower in 1892. What did he use it for?","as a laboratory for studying the city",["as a private house for his family","as a workshop for making telescopes","as a school for landscape painters"],"He was a botanist who turned to town planning, and he thought you should look hard at a city from above before rebuilding anything in it. He called the building the Outlook Tower."),h("edinburgh","natur",2,"In the camera obscura room, what can you do to the people on the table?","lift them on a piece of card",["hear them speak","zoom in on their faces","change the weather"],"Slide a white card under the projected image and a passer-by appears to rise off the street. It is the trick everybody tries."),h("edinburgh","natur",2,"Why is the image in a camera obscura the right way up on the table?","the mirror flips what the lens inverted",["a lens on its own does not invert","the table is curved to correct it","the darkness of the room reverses it"],"A lens alone gives you an upside-down picture. The angled mirror above turns it back, and the dish is curved to keep the whole scene in focus at once."),h("edinburgh","natur",2,"In the Vortex Tunnel, the bridge is still but you feel yourself tipping. Why?","your eyes overrule your balance",["the bridge really does move","the floor is sloped","air is blown at you"],"The spinning cylinder fills your vision, so the eyes report movement while the inner ear reports none. The eyes win, and people grip the rail."),h("edinburgh","natur",3,"In an Ames room, one person looks huge and the other tiny. What is the trick?","the room is not the shape it appears",["the people stand on hidden steps","mirrors do the work","the lighting is uneven"],"One corner is much further away than the other, but the room is built to look rectangular from one peephole. Your brain would rather resize a person than accept a crooked room."),h("edinburgh","natur",3,"Why do you never get lost for long in a mirror maze?","the mirrors repeat a small space many times",["the mirrors are one-way from behind","the floor is marked with a faint route","there is really only one way through"],"Angled mirrors multiply a handful of corridors into what looks like a hall of them. Hands out in front is not cheating, it is the only reliable method."),h("edinburgh","zahlen",2,"What can you see from the rooftop terrace above the camera?","the castle, the Old Town and the Firth of Forth",["nothing but the castle wall opposite","the Highlands on a clear afternoon","the North Sea coast of England"],"The tower sits on the Royal Mile just below the castle esplanade, so the terrace looks along the ridge and out over the water to Fife."),h("edinburgh","natur",1,"What is the rock Edinburgh Castle stands on?","an extinct volcano",["a natural limestone hill","a man-made mound","a glacial moraine"],"The hard plug of an old volcano. A glacier later scraped past it, sheltering a tail of softer rock behind, and the Royal Mile runs down that tail."),h("edinburgh","zahlen",1,"At what time is the gun fired at Edinburgh Castle?","one o'clock",["midday","six o'clock","midnight"],"One shot instead of twelve, because powder cost money. It has been fired on almost every weekday since 1861."),h("edinburgh","natur",3,"The One O'Clock Gun was set up to work with what, down on the coast?","a time ball ships could see",["a time ball that ships could see","a lighthouse flashing on the hour","a semaphore tower on Calton Hill"],"The ball on Calton Hill drops at one, but on a foggy day nobody could see it. Sound carries where sight does not, which is the whole point of the gun."),h("edinburgh","kron",2,"What is Mons Meg?","a giant medieval cannon",["a castle tower","a Scottish queen","a bagpipe tune"],"Made in Mons in 1449 and given to James II. It threw a stone ball weighing about 150 kilos, and needed a hundred men and a team of oxen to move it anywhere."),h("edinburgh","kron",3,"What eventually happened to Mons Meg?","her barrel burst while firing a salute",["she was captured and taken to France","she sank on a barge in the Forth","she was melted down for scrap metal"],"In 1681, firing for the Duke of Albany. She sat as a ruin in the Tower of London for decades until Walter Scott campaigned to have her brought home."),h("edinburgh","kron",2,"What is the oldest building in Edinburgh?","St Margaret's Chapel, in the castle",["St Giles' Cathedral","the Palace of Holyroodhouse","the Tolbooth"],"A tiny Norman chapel from about 1130, built by David I for his mother. It survived because it was used as a gunpowder store and nobody thought to knock it down."),h("edinburgh","kron",2,"What are the Honours of Scotland?","the crown, sceptre and sword of state",["three historic swords of the realm","the ceremonial keys of the castle","a set of royal portraits in gold frames"],"The oldest crown jewels in Britain. England's were melted down under Cromwell; Scotland's were smuggled out of a besieged castle and buried under a church floor."),h("edinburgh","kron",3,"The Honours were locked away and forgotten for over a century. Who found them?","Walter Scott, in 1818",["Queen Victoria","Bonnie Prince Charlie","Robert Burns"],"He got royal permission to break open a sealed chest in the castle. They were exactly where they had been left after the Union of 1707, wrapped in linen."),h("edinburgh","kron",2,"What is the Stone of Destiny?","the stone Scottish kings were crowned on",["a meteorite that fell in the Highlands","a memorial to the Scottish fallen","the foundation stone of the castle"],"Taken to Westminster by Edward I in 1296 and returned to Scotland in 1996. It went back down to London once more, for the coronation in 2023, and then came straight home."),h("edinburgh","kron",3,"In 1950 four students took the Stone of Destiny from Westminster Abbey. What happened?","they broke it, mended it, and it turned up in Scotland",["they were never identified by police","the stone was never recovered at all","all four were sent to prison for it"],"It cracked in two during the removal. A Glasgow stonemason repaired it, and it reappeared months later on the altar at Arbroath. Nobody was ever prosecuted."),h("edinburgh","zahlen",2,"How long is the Royal Mile?","a Scots mile, slightly longer than an English one",["exactly one English mile, end to end","half a mile from the castle gate","a full three miles including the park"],"About 1.81 kilometres, from the castle down to Holyroodhouse. The Scots mile was abolished by the Union but the street kept its name."),h("edinburgh","kron",3,"What was on the spot marked by the Heart of Midlothian in the pavement?","the old tolbooth prison",["a church","a market cross","a well"],"Passers-by still spit on it, which began as contempt for the jail and its executions. It is considered good luck now, which is a strange thing for a heart to become."),h("edinburgh","kron",3,"Deacon Brodie, of the Royal Mile, is thought to have inspired which story?","Jekyll and Hyde",["Frankenstein","Dracula","Treasure Island"],"A respectable cabinetmaker and city councillor by day, a burglar by night, hanged in 1788. Robert Louis Stevenson grew up hearing about him."),h("edinburgh","kron",2,"What is unusual about the spire of St Giles' Cathedral?","it is shaped like a crown",["it leans","it is made of wood","it has no bells"],"A crown steeple, one of the few left. John Knox preached there, and the cathedral sits about halfway down the Royal Mile."),h("edinburgh","natur",1,"Which famous sheep is on display in the National Museum of Scotland?","Dolly",["Shaun","Molly","Bonnie"],"The first mammal cloned from an adult cell, born at the Roslin Institute just outside Edinburgh in 1996. She is stuffed, on a turntable, looking mildly unimpressed."),h("edinburgh","natur",3,"Why was Dolly the sheep such a shock to biologists?","an adult cell was made to start a whole new animal",["she had two mothers and no father","she was born entirely without wool","she lived far longer than a normal sheep"],"It had been assumed that a specialised adult cell could not be wound back to the beginning. Dolly proved it could, and every debate about cloning since starts there."),h("edinburgh","zahlen",3,"Where did Dolly the sheep get her name?","from the singer Dolly Parton",["from a scientist's daughter","from the Gaelic for lamb","from a laboratory code"],"The cell used came from a mammary gland, and the Roslin team could not resist. Dolly herself was a Finn Dorset, born to a surrogate Scottish Blackface."),h("edinburgh","sammlung",2,"What sits at the heart of the museum's great Victorian hall?","a glass roof over a cast-iron gallery",["a stone keep left from an older castle","a planetarium under a copper dome","a Roman bath uncovered on the site"],"The Grand Gallery, opened in 1866 and modelled on the Crystal Palace. Its Window on the World display runs several storeys up the wall and is the largest of its kind in Britain."),h("edinburgh","sammlung",2,"What does the Millennium Clock in the museum do on the hour?","it moves, with figures and music",["it chimes twelve times, whatever the hour","it projects the date onto the ceiling","nothing at all, it has never worked"],"A dark carved tower of a thing, full of figures representing the suffering of the twentieth century. Not the cheerful clock a child expects, and all the more memorable for it."),h("edinburgh","kron",3,"The museum holds the Maiden. What is it?","an early Scottish beheading machine",["a figurehead from a Leith trading ship","a carved Pictish statue from Angus","a royal wedding dress of the 1560s"],"In use in Edinburgh from the 1560s, two centuries before the French guillotine. One of its victims was the man who had introduced it."),h("edinburgh","sammlung",3,"The Monymusk Reliquary is said to have been carried where?","into the Battle of Bannockburn",["on a voyage to Iceland","up Arthur's Seat","to Rome"],"A small house-shaped box of wood and metal, made around 750, said to have held a relic of St Columba. The battlefield story is tradition rather than proven fact."),h("edinburgh","zahlen",2,"What does it cost to enter the National Museum of Scotland?","nothing",["ten pounds","five pounds","free only on Sundays"],"As with the British Museum and the others in London. Special exhibitions are charged for; the permanent collection is not."),h("edinburgh","sammlung",3,"Eleven Lewis Chessmen live in Edinburgh. Where were they carved?","Norway, most likely Trondheim",["Scotland, probably in the Hebrides","Iceland, in the years after settlement","Ireland, in a monastic workshop"],"Walrus ivory, around 1200, when the Hebrides were ruled from Norway. They were found in a sandbank on Lewis in 1831 and nobody knows why they were buried there."),h("edinburgh","natur",2,"What can you see from the museum's roof terrace?","the castle and the Old Town rooftops",["the Highlands on a clear afternoon","the Forth Bridge away to the north","the open sea beyond the harbour"],"Seven floors up and easy to miss. It is one of the better free views in the city."),h("edinburgh","kron",1,"On 27 June the family saw a parade in Edinburgh. What was it for?","Armed Forces Day",["the King's birthday","a football victory","the Edinburgh Festival"],"Held on the last Saturday of June across the whole United Kingdom, with around two hundred events. Edinburgh's is one of the largest in Scotland."),h("edinburgh","zahlen",2,"Where did the Armed Forces Day parade form up?","Charlotte Square",["the castle esplanade","Holyrood Park","Princes Street Gardens"],"Stepping off at half past ten and marching along George Street to St Andrew Square, with a saluting dais outside the Assembly Rooms."),h("edinburgh","zahlen",2,"Roughly how many people marched in the Edinburgh parade?","around 400",["around 40","around 4000","around 40,000"],"Serving personnel, veterans and supporters, led by a dozen vintage military vehicles from the Scottish Military Vehicle Group."),h("edinburgh","kron",2,"Which bands led the parade along George Street?","the Royal Regiment of Scotland's bands",["the Coldstream Guards, down from London","an orchestra from a local high school","the band of the Royal Marines"],"The Lowland and Highland Bands, with the Royal Air Force Central Scotland Pipes and Drums. In Edinburgh a parade without pipes would be a strange thing."),h("edinburgh","kron",1,"On the same Saturday the King was in Edinburgh. What was he doing?","opening a new session of the Scottish Parliament",["opening a new museum on the Royal Mile","taking the salute at the parade","attending a football match at Hampden
