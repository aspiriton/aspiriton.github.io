B5\u03B9\u03BC\u03AD\u03BD\u03BF\u03C5;","\u03B4\u03B9\u03B1\u03C4\u03C5\u03C0\u03CE\u03BD\u03B5\u03B9 \u03B8\u03AD\u03C3\u03B7 \u03BA\u03B1\u03B9 \u03C4\u03B7 \u03C3\u03C4\u03B7\u03C1\u03AF\u03B6\u03B5\u03B9 \u03BC\u03B5 \u03C4\u03B5\u03BA\u03BC\u03AE\u03C1\u03B9\u03B1",["\u03C0\u03B5\u03C1\u03B9\u03B3\u03C1\u03AC\u03C6\u03B5\u03B9 \u03AD\u03BD\u03B1\u03BD \u03C4\u03CC\u03C0\u03BF","\u03B5\u03BE\u03B9\u03C3\u03C4\u03BF\u03C1\u03B5\u03AF \u03B3\u03B5\u03B3\u03BF\u03BD\u03CC\u03C4\u03B1 \u03BC\u03B5 \u03C7\u03C1\u03BF\u03BD\u03B9\u03BA\u03AE \u03C3\u03B5\u03B9\u03C1\u03AC","\u03B4\u03AF\u03BD\u03B5\u03B9 \u03BF\u03B4\u03B7\u03B3\u03AF\u03B5\u03C2 \u03B2\u03AE\u03BC\u03B1 \u03B2\u03AE\u03BC\u03B1"],"\u0398\u03AD\u03C3\u03B7, \u03B5\u03C0\u03B9\u03C7\u03B5\u03B9\u03C1\u03AE\u03BC\u03B1\u03C4\u03B1, \u03C4\u03B5\u03BA\u03BC\u03AE\u03C1\u03B9\u03B1 \u03BA\u03B1\u03B9 \u03C3\u03C5\u03C7\u03BD\u03AC \u03B1\u03BD\u03C4\u03AF\u03BA\u03C1\u03BF\u03C5\u03C3\u03B7.","\u0395\u03AF\u03B4\u03B7 \u03BA\u03B5\u03B9\u03BC\u03AD\u03BD\u03C9\u03BD"),()=>v("\u03A4\u03B9 \u03B4\u03B9\u03B1\u03C6\u03BF\u03C1\u03AC \u03AD\u03C7\u03B5\u03B9 \u03C4\u03BF \u03B5\u03C0\u03B9\u03C7\u03B5\u03AF\u03C1\u03B7\u03BC\u03B1 \u03B1\u03C0\u03CC \u03C4\u03BF \u03C4\u03B5\u03BA\u03BC\u03AE\u03C1\u03B9\u03BF;","\u03C4\u03BF \u03B5\u03C0\u03B9\u03C7\u03B5\u03AF\u03C1\u03B7\u03BC\u03B1 \u03B5\u03AF\u03BD\u03B1\u03B9 \u03BF \u03C3\u03C5\u03BB\u03BB\u03BF\u03B3\u03B9\u03C3\u03BC\u03CC\u03C2, \u03C4\u03BF \u03C4\u03B5\u03BA\u03BC\u03AE\u03C1\u03B9\u03BF \u03C4\u03BF \u03B1\u03C0\u03BF\u03B4\u03B5\u03B9\u03BA\u03C4\u03B9\u03BA\u03CC \u03C3\u03C4\u03BF\u03B9\u03C7\u03B5\u03AF\u03BF",["\u03B5\u03AF\u03BD\u03B1\u03B9 \u03C4\u03B1\u03C5\u03C4\u03CC\u03C3\u03B7\u03BC\u03B1","\u03C4\u03BF \u03C4\u03B5\u03BA\u03BC\u03AE\u03C1\u03B9\u03BF \u03B5\u03AF\u03BD\u03B1\u03B9 \u03C0\u03B9\u03BF \u03B1\u03B4\u03CD\u03BD\u03B1\u03BC\u03BF","\u03C4\u03BF \u03B5\u03C0\u03B9\u03C7\u03B5\u03AF\u03C1\u03B7\u03BC\u03B1 \u03B5\u03AF\u0
